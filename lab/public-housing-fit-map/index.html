<html lang="ko">

<title>Rent Check Lab · 나에게 맞는 공공주택</title>
<style>
:root{--ink:#172033;--muted:#727b8b;--line:#e4e8ed;--paper:#f4f1ea;--navy:#172b4d;--blue:#547cf2;--green:#8bbd72;--orange:#eca05a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:1460px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.logo{font-weight:800;display:flex;gap:10px;align-items:center}.logo i{font-style:normal;background:var(--navy);color:#fff;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11px}.top small{color:var(--muted)}.bar{height:3px;background:#dddfe1;border-radius:9px;margin-bottom:24px;overflow:hidden}.bar:before{content:"";display:block;width:34%;height:100%;background:var(--navy)}
.stage{display:grid;grid-template-columns:255px minmax(0,1fr) 235px;gap:22px;align-items:stretch}.intro{padding:18px 4px}.eyebrow{font-size:12px;color:#6482c0;font-weight:800;margin-bottom:13px}.intro h1{font-size:34px;line-height:1.18;letter-spacing:-1.1px;margin:0 0 16px}.intro p{font-size:14px;line-height:1.7;color:var(--muted);margin:0}.world{position:relative;min-height:600px;border-radius:30px;overflow:hidden;background:radial-gradient(circle at 28% 12%,#fff 0,#f7fafc 35%,#eef3f6 75%,#e5ebef 100%);border:1px solid #e6eaee;box-shadow:0 22px 60px rgba(36,49,74,.10)}#scene{position:absolute;inset:0}.hint,.feed{position:absolute;bottom:16px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.80);backdrop-filter:blur(9px);border-radius:999px;padding:8px 10px;font-size:10px;color:#687386}.hint{left:16px}.feed{right:16px}.side{display:flex;flex-direction:column;gap:13px}.panel{padding:15px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:21px;box-shadow:0 8px 26px rgba(40,54,80,.05)}.ptitle{font-size:12px;font-weight:800;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between}.num{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#edf2ff;color:#5470b8;font-size:10px;margin-right:5px}.num.g{background:#eff7eb;color:#6a9357}.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.q{border:1px solid var(--line);border-radius:13px;background:#f8f9fb;padding:9px;text-align:left;cursor:pointer}.q b{display:block;font-size:11px}.q small{font-size:9px;color:var(--muted)}.q.on{background:#eef3ff;border-color:#91a9e8}.filters{display:grid;gap:7px}.filters label{font-size:10px;color:var(--muted)}select{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff;color:var(--ink);width:100%}
.result{margin-top:18px;display:grid;grid-template-columns:1fr 210px;gap:16px}.listbox{background:#fff;border:1px solid var(--line);border-radius:23px;padding:17px}.listhead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:11px}.listhead h2{font-size:18px;margin:0}.listhead p{margin:3px 0 0;font-size:11px;color:var(--muted)}.legend{display:flex;gap:8px;font-size:9px;color:#6f7988}.legend span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.legend .sh:before{background:var(--blue)}.legend .lh:before{background:var(--green)}.legend .seoul:before{background:var(--orange)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff;cursor:pointer;transition:.18s}.card:hover,.card.on{transform:translateY(-2px);border-color:#9fb2df;box-shadow:0 10px 24px rgba(45,61,92,.08)}.tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}.tag{font-size:9px;background:#eef2f6;color:#566170;padding:4px 6px;border-radius:999px}.tag.open{background:#edf6ea;color:#5d874d}.tag.hot{background:#fff0e2;color:#b56828}.card h3{font-size:13px;line-height:1.42;margin:0 0 7px}.card .date{font-size:10px;color:var(--muted);line-height:1.5}.score{background:var(--navy);color:#fff;border-radius:23px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;min-height:165px}.score small{opacity:.65}.score strong{font-size:29px}.score p{font-size:11px;line-height:1.55;opacity:.78;margin:0}.empty{padding:28px;color:var(--muted);font-size:12px}
@media(max-width:1050px){.stage{grid-template-columns:1fr}.intro{padding:0}.intro h1{font-size:29px}.world{min-height:500px}.side{display:grid;grid-template-columns:1fr 1fr}.result{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.page{padding:15px 11px 26px}.top small{display:none}.stage{gap:13px}.intro h1{font-size:27px}.world{min-height:405px;border-radius:23px}.side{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.hint{max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result{margin-top:13px}}
</style>

<body>
<main class="page">
  <header class="top"><div class="logo"><i>RC</i>Rent Check Lab · 내 공공주택 리포트</div><small>실시간 공고 피드</small></header>
  <div class="bar"></div>
  <section class="stage">
    <div class="intro"><div class="eyebrow">1. 개요</div><h1>내 조건과<br>원하는 집으로<br>신청 후보를<br>골라봅니다.</h1><p>행복주택·미리내집·신혼희망타운 등 서울 공공주택 공고를 조건별로 줄여서 3D 지도 위에 보여주는 실험 화면입니다.</p></div>
    <div class="world"><div id="scene"></div><div class="hint">드래그해서 서울을 돌려보세요 · 공고 카드를 누르면 위치 강조</div><div class="feed" id="feed">공고 불러오는 중…</div></div>
    <aside class="side">
      <div class="panel"><div class="ptitle"><span><i class="num">01</i>청약 자격</span><span id="qualText">기본</span></div><div class="qgrid"><button class="q on" data-q="무주택"><b>무주택</b><small>기본 조건</small></button><button class="q" data-q="신혼부부"><b>신혼·가구</b><small>신혼부부</small></button><button class="q" data-q="청년"><b>청년</b><small>청년 대상</small></button><button class="q" data-q="신생아"><b>신생아</b><small>신생아 우대</small></button></div></div>
      <div class="panel"><div class="ptitle"><span><i class="num g">02</i>원하는 집</span></div><div class="filters"><label>지역</label><select id="region"><option value="all">서울 전체</option><option>강서구</option><option>양천구</option><option>마포구</option><option>은평구</option><option>영등포구</option><option>성동구</option><option>강동구</option><option>송파구</option></select><label>주택 유형</label><select id="type"><option value="all">전체 유형</option><option>행복주택</option><option>미리내집</option><option>신혼희망타운</option><option>매입임대</option><option>장기전세</option></select><label>접수 상태</label><select id="state"><option value="open">마감 제외</option><option>접수중</option><option>마감임박</option><option>접수예정</option><option value="all">전체</option></select></div></div>
    </aside>
  </section>
  <section class="result"><div class="listbox"><div class="listhead"><div><h2>지금 볼 만한 공고</h2><p id="summary">조건에 맞는 후보를 찾고 있습니다.</p></div><div class="legend"><span class="sh">SH</span><span class="lh">LH</span><span class="seoul">서울</span></div></div><div class="cards" id="cards"></div></div><div class="score"><small>현재 조건에서</small><strong id="big">-</strong><p id="scoreText">공고를 불러오면 후보 수와 접수 상태를 요약합니다.</p></div></section>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const FEED='https://raw.githubusercontent.com/arttoy61-png/rent-check/main/public_housing_notices.json';
const GU={강서구:[-6.2,.5],양천구:[-5.2,-1.3],구로구:[-4.0,-2.8],금천구:[-3.0,-4.0],영등포구:[-3.0,-1.1],마포구:[-3.2,1.5],은평구:[-3.1,3.8],서대문구:[-1.8,2.2],종로구:[0,2.5],중구:[.3,1.3],용산구:[-.2,-.1],동작구:[-1.4,-2.3],관악구:[-.8,-3.9],서초구:[1.9,-2.9],강남구:[3.4,-2.2],송파구:[5.2,-1.7],강동구:[6.5,.1],광진구:[3.4,.8],성동구:[2,.7],동대문구:[2.1,2.2],중랑구:[3.6,3.3],성북구:[1.1,3.7],강북구:[.5,5.1],도봉구:[1.1,6.3],노원구:[2.8,5.7]};
const guNames=Object.keys(GU);let notices=[],marks=[],active=null;
const district=x=>{const t=(x.title||'')+' '+(x.region||'');return guNames.find(g=>t.includes(g))||''};
const htype=x=>{const t=x.title||'';if(t.includes('미리내집'))return '미리내집';if(t.includes('신혼희망타운'))return '신혼희망타운';return (x.housing_types||[])[0]||'기타임대'};
const acolor=a=>a==='LH'?0x8bbd72:(a==='SH'?0x547cf2:0xeca05a);const fdate=v=>v?v.replaceAll('-','.'):'일정 확인';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf1f5f8);const camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(0,-19,18);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;document.querySelector('#scene').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0xc6d0d8,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-8,-7,18);sun.castShadow=true;scene.add(sun);
const mapGroup=new THREE.Group();scene.add(mapGroup);const s=new THREE.Shape();[[-7.2,1],[-6.3,3],[-4.8,4],[-3.8,5.8],[-1.7,6.7],[.7,6.1],[2.4,6.7],[4.1,5.3],[5.7,4],[7,2.2],[7.2,.1],[6.3,-1.5],[5.8,-3.4],[4,-4.6],[1.7,-5.2],[-.4,-5],[-2,-5.7],[-3.4,-4.5],[-5.4,-4.2],[-6.3,-2.3],[-7.3,-.7]].forEach((p,i)=>i?s.lineTo(...p):s.moveTo(...p));s.closePath();const geo=new THREE.ExtrudeGeometry(s,{depth:.7,bevelEnabled:true,bevelThickness:.18,bevelSize:.16,bevelSegments:3});geo.rotateX(Math.PI/2);geo.translate(0,0,-.35);const city=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xf9fbfc,roughness:.75}));city.castShadow=true;city.receiveShadow=true;mapGroup.add(city);const floor=new THREE.Mesh(new THREE.CircleGeometry(13,64),new THREE.ShadowMaterial({opacity:.13}));floor.rotation.x=-Math.PI/2;floor.position.z=-1;floor.receiveShadow=true;scene.add(floor);
let dragging=false,lx=0,ly=0,rx=.02,rz=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;rz+=(e.clientX-lx)*.005;rx=Math.max(-.18,Math.min(.20,rx+(e.clientY-ly)*.002));lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointerup',()=>dragging=false);
function clearMarks(){marks.forEach(m=>mapGroup.remove(m.g));marks=[];active=null}
function addMark(item,i){const d=district(item),p=d?GU[d]:[((i%5)-2)*1.1,((Math.floor(i/5)%3)-1)*1.1],g=new THREE.Group(),h=.7+(i%5)*.22,mat=new THREE.MeshStandardMaterial({color:acolor(item.agency_group||item.agency),roughness:.35});const pole=new THREE.Mesh(new THREE.CylinderGeometry(.11,.15,h,12),mat);pole.rotation.x=Math.PI/2;pole.position.z=h/2+.3;const cap=new THREE.Mesh(new THREE.SphereGeometry(.22,14,14),mat);cap.position.z=h+.3;g.add(pole,cap);g.position.set(p[0]+((i%3)-1)*.15,p[1]+((i%2)-.5)*.15,.25);mapGroup.add(g);marks.push({item,g,cap})}
function qualify(){return [...document.querySelectorAll('.q.on')].map(x=>x.dataset.q)}
function match(x){const r=document.querySelector('#region').value,t=document.querySelector('#type').value,st=document.querySelector('#state').value;if(r!=='all'&&district(x)!==r)return false;if(t!=='all'&&htype(x)!==t&&!(x.title||'').includes(t)&&!(x.housing_types||[]).includes(t))return false;if(st==='open'&&x.open_state==='마감')return false;if(!['open','all'].includes(st)&&x.open_state!==st)return false;const q=qualify().filter(v=>v!=='무주택');if(q.length){const txt=(x.title||'')+' '+(x.audiences||[]).join(' ');if(!q.some(v=>txt.includes(v)||(v==='신혼부부'&&(txt.includes('미리내집')||txt.includes('신혼희망타운')))))return false}return true}
function tclass(s){return s==='마감임박'?'hot':(['접수중','접수예정'].includes(s)?'open':'')}
function focus(item){marks.forEach(m=>m.g.scale.setScalar(m.item===item?1.75:1));active=marks.find(m=>m.item===item)||null}
function render(){const list=notices.filter(match).slice(0,9);document.querySelector('#summary').textContent=`실시간 공고 ${notices.length}건 중 조건에 맞는 후보 ${list.length}건`;document.querySelector('#big').textContent=`${list.length}건`;const soon=list.filter(x=>x.open_state==='마감임박').length;document.querySelector('#scoreText').textContent=soon?`이 중 ${soon}건은 마감이 임박했습니다. 카드에서 신청일과 마감일을 먼저 확인하세요.`:'마감 공고는 기본적으로 제외했습니다. 조건을 바꾸면 후보가 다시 계산됩니다.';const box=document.querySelector('#cards');box.innerHTML=list.length?list.map((x,i)=>`<article class="card" data-i="${i}"><div class="tags"><span class="tag">${x.agency_group||x.agency||'공공'}</span><span class="tag">${htype(x)}</span><span class="tag ${tclass(x.open_state)}">${x.open_state||'확인필요'}</span></div><h3>${x.title}</h3><div class="date">${district(x)||'서울'} · 신청 ${fdate(x.application_start)}<br>마감 ${fdate(x.deadline)}</div></article>`).join(''):'<div class="empty">현재 조건에 맞는 공고가 없습니다. 조건을 조금 넓혀보세요.</div>';clearMarks();list.forEach(addMark);[...document.querySelectorAll('.card')].forEach((el,i)=>el.onclick=()=>{document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));el.classList.add('on');focus(list[i])})}
async function load(){try{const r=await fetch(FEED+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const j=await r.json();notices=(j.items||[]).filter(x=>x&&x.title);document.querySelector('#feed').textContent=`실제 공고 ${notices.length}건 · ${String(j.generated_at||'').replace('T',' ')}`;render()}catch(e){document.querySelector('#feed').textContent='공고 피드 연결 확인 필요';document.querySelector('#summary').textContent='실시간 공고 피드를 불러오지 못했습니다.'}}
function resize(){const el=document.querySelector('#scene'),w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{if(b.dataset.q==='무주택')b.classList.add('on');else b.classList.toggle('on');document.querySelector('#qualText').textContent=qualify().filter(v=>v!=='무주택').join('·')||'기본';render()});['region','type','state'].forEach(id=>document.querySelector('#'+id).onchange=render);(function loop(){requestAnimationFrame(loop);mapGroup.rotation.z=rz;mapGroup.rotation.x=rx;if(active)active.cap.rotation.y+=.04;renderer.render(scene,camera)})();load();
</script>
</body>
</html>
