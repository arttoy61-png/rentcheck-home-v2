<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Rent Check Lab · 나에게 맞는 공공주택</title>
<meta name="robots" content="noindex,nofollow" />
<style>
:root{--ink:#172033;--muted:#6e7787;--line:#e7ebf0;--paper:#f5f3ed;--card:#ffffff;--navy:#172b4d;--blue:#4d7cff;--green:#8abf74;--orange:#f0a35b;--shadow:0 18px 50px rgba(29,42,68,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
button,select{font:inherit}.wrap{min-height:100vh;padding:26px}.shell{max-width:1440px;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.brand-badge{width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px}.date{font-size:13px;color:var(--muted)}
.progress{height:3px;background:#e3e6e8;border-radius:999px;margin-bottom:26px;overflow:hidden}.progress span{display:block;width:38%;height:100%;background:var(--navy)}
.hero{display:grid;grid-template-columns:260px minmax(0,1fr) 240px;gap:22px;align-items:stretch}.intro{padding:20px 4px 0}.eyebrow{font-size:13px;color:#6685c6;font-weight:800;margin-bottom:12px}.intro h1{font-size:34px;line-height:1.2;letter-spacing:-1.1px;margin:0 0 16px}.intro p{font-size:15px;line-height:1.7;color:var(--muted);margin:0}.scene-card{position:relative;min-height:610px;border:1px solid rgba(93,107,132,.12);border-radius:30px;background:linear-gradient(145deg,#f7fafc 0%,#eef3f7 64%,#e8eef4 100%);box-shadow:var(--shadow);overflow:hidden}.scene-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 10%,rgba(255,255,255,.98),transparent 42%);pointer-events:none}.canvas-wrap{position:absolute;inset:0}canvas{display:block;width:100%!important;height:100%!important}.scene-label{position:absolute;left:22px;bottom:18px;font-size:12px;color:#697385;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);padding:8px 10px;border-radius:999px;backdrop-filter:blur(8px)}
.side{display:flex;flex-direction:column;gap:14px}.panel{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 24px rgba(29,42,68,.05)}.panel-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:12px}.step{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;background:#eaf0ff;color:#4f70c8}.step.green{background:#eef7e9;color:#699453}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{border:1px solid var(--line);background:#f7f8fa;border-radius:14px;padding:10px;text-align:left;cursor:pointer;transition:.18s}.chip b{display:block;font-size:12px;margin-bottom:4px}.chip span{font-size:10px;color:var(--muted)}.chip.active{border-color:#7f9cff;background:#eef3ff;box-shadow:0 0 0 2px rgba(77,124,255,.08) inset}.filter-row{display:grid;gap:8px}.filter-row label{font-size:11px;color:var(--muted)}select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink)}
.summary{margin-top:22px;display:grid;grid-template-columns:1fr 220px;gap:18px}.candidates{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(29,42,68,.05)}.summary-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.summary-head h2{margin:0;font-size:19px}.summary-head p{margin:0;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.notice{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff;cursor:pointer;transition:.18s}.notice:hover,.notice.active{transform:translateY(-2px);border-color:#9cb2e8;box-shadow:0 9px 24px rgba(50,71,110,.08)}.notice .meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.tag{font-size:10px;padding:4px 7px;border-radius:999px;background:#eef2f7;color:#536070}.tag.hot{background:#fff0e3;color:#b7651f}.tag.open{background:#ebf5e8;color:#5b8a4a}.notice h3{font-size:14px;line-height:1.45;margin:0 0 8px}.notice .dates{font-size:11px;color:var(--muted);line-height:1.5}.mini{background:#172b4d;color:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}.mini small{opacity:.65}.mini strong{font-size:26px;line-height:1.1}.mini p{font-size:12px;line-height:1.55;opacity:.82;margin:0}.legend{display:flex;gap:10px;align-items:center;font-size:10px;color:#7a8494}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.a{background:#4d7cff}.dot.b{background:#8abf74}.dot.c{background:#f0a35b}
.status{position:absolute;right:18px;bottom:18px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);padding:8px 10px;border-radius:12px;font-size:11px;color:#697385}.hidden{display:none!important}
@media(max-width:1050px){.hero{grid-template-columns:1fr}.intro{padding:0}.intro h1{font-size:30px}.side{display:grid;grid-template-columns:1fr 1fr}.scene-card{min-height:520px}.summary{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.wrap{padding:16px 12px 28px}.topbar{margin-bottom:12px}.date{display:none}.hero{gap:14px}.intro h1{font-size:27px}.intro p{font-size:14px}.scene-card{min-height:410px;border-radius:24px}.side{grid-template-columns:1fr}.summary{margin-top:14px}.cards{grid-template-columns:1fr}.mini{min-height:150px}.scene-label{left:14px;bottom:14px}.status{right:14px;bottom:14px}.grid2{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap"><div class="shell">
  <div class="topbar"><div class="brand"><div class="brand-badge">RC</div>Rent Check Lab · 내 공공주택 리포트</div><div class="date" id="dateLabel">실시간 공고 피드</div></div>
  <div class="progress"><span></span></div>

  <section class="hero">
    <div class="intro">
      <div class="eyebrow">1. 개요</div>
      <h1>내 조건과<br>원하는 집으로<br>신청 후보를<br>골라봅니다.</h1>
      <p>행복주택·미리내집·신혼희망타운 등 서울 공공주택 공고를 조건별로 줄여서 지도 위에 보여주는 실험 화면입니다.</p>
    </div>

    <div class="scene-card">
      <div class="canvas-wrap" id="canvasWrap"></div>
      <div class="scene-label">마우스로 돌려보기 · 공고 카드를 누르면 위치가 강조됩니다</div>
      <div class="status" id="feedStatus">공고 불러오는 중…</div>
    </div>

    <aside class="side">
      <div class="panel">
        <div class="panel-title"><span><span class="step">01</span> 청약 자격</span><span id="qualText">기본</span></div>
        <div class="grid2" id="qualGrid">
          <button class="chip active" data-qual="무주택"><b>무주택</b><span>기본 조건</span></button>
          <button class="chip" data-qual="신혼부부"><b>신혼·가구</b><span>신혼부부</span></button>
          <button class="chip" data-qual="청년"><b>청년</b><span>청년 대상</span></button>
          <button class="chip" data-qual="신생아"><b>신생아</b><span>신생아 우대</span></button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title"><span><span class="step green">02</span> 원하는 집</span></div>
        <div class="filter-row">
          <label>지역</label><select id="region"><option value="all">서울 전체</option><option>강서구</option><option>양천구</option><option>마포구</option><option>은평구</option><option>영등포구</option><option>동작구</option><option>성동구</option><option>강동구</option><option>송파구</option></select>
          <label>주택 유형</label><select id="housing"><option value="all">전체 유형</option><option value="행복주택">행복주택</option><option value="미리내집">미리내집</option><option value="신혼희망타운">신혼희망타운</option><option value="매입임대">매입임대</option><option value="장기전세">장기전세</option></select>
          <label>접수 상태</label><select id="state"><option value="all">마감 제외</option><option value="접수중">접수중</option><option value="마감임박">마감임박</option><option value="접수예정">접수예정</option><option value="all2">전체</option></select>
        </div>
      </div>
    </aside>
  </section>

  <section class="summary">
    <div class="candidates">
      <div class="summary-head"><div><h2>지금 볼 만한 공고</h2><p id="summaryText">조건에 맞는 후보를 찾고 있습니다.</p></div><div class="legend"><span><i class="dot a"></i> SH</span><span><i class="dot b"></i> LH</span><span><i class="dot c"></i> 서울</span></div></div>
      <div class="cards" id="cards"></div>
    </div>
    <div class="mini"><small>현재 조건에서</small><strong id="countBig">-</strong><p id="miniText">공고를 불러오면 후보 수와 접수 상태를 요약합니다.</p></div>
  </section>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script>
const FEED='https://raw.githubusercontent.com/arttoy61-png/rent-check/main/public_housing_notices.json';
const GU_POS={
 '강서구':[-6.4,.6],'양천구':[-5.2,-1.4],'구로구':[-4.2,-3.0],'금천구':[-3.2,-4.2],'영등포구':[-3.2,-1.2],
 '마포구':[-3.3,1.5],'은평구':[-3.2,4.0],'서대문구':[-1.8,2.3],'종로구':[.0,2.5],'중구':[.3,1.3],'용산구':[-.2,-.2],
 '동작구':[-1.5,-2.4],'관악구':[-1.0,-4.0],'서초구':[1.8,-3.0],'강남구':[3.3,-2.3],'송파구':[5.2,-1.8],'강동구':[6.7,.2],
 '광진구':[3.4,.7],'성동구':[1.9,.7],'동대문구':[2.0,2.2],'중랑구':[3.6,3.4],'성북구':[1.0,3.7],'강북구':[.5,5.2],
 '도봉구':[1.0,6.6],'노원구':[2.8,5.8]
};
const guNames=Object.keys(GU_POS);
let feed=[]; let markers=[]; let activeMarker=null;

function districtOf(item){const t=(item.title||'')+' '+(item.region||'');return guNames.find(g=>t.includes(g))||''}
function typeOf(item){const a=item.housing_types||[];const t=item.title||'';if(t.includes('미리내집'))return '미리내집';if(t.includes('신혼희망타운'))return '신혼희망타운';return a[0]||'기타임대'}
function agencyColor(a){return a==='LH'?0x8abf74:(a==='SH'?0x4d7cff:0xf0a35b)}
function fmtDate(v){return v?v.replaceAll('-','.'):'일정 확인'}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf1f5f8);
const camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(0,-18,18);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;document.getElementById('canvasWrap').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xc9d2da,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-8,-6,18);sun.castShadow=true;scene.add(sun);

const shape=new THREE.Shape();
[[-7.2,1.0],[-6.2,3.0],[-4.7,4.0],[-3.9,5.9],[-1.6,6.8],[.6,6.2],[2.3,6.8],[4.0,5.4],[5.6,4.2],[6.9,2.4],[7.3,.1],[6.3,-1.4],[5.9,-3.4],[4.0,-4.7],[1.7,-5.3],[-.3,-5.0],[-2.0,-5.8],[-3.3,-4.6],[-5.5,-4.3],[-6.2,-2.4],[-7.3,-.8]].forEach((p,i)=>i?shape.lineTo(p[0],p[1]):shape.moveTo(p[0],p[1]));shape.closePath();
const geo=new THREE.ExtrudeGeometry(shape,{depth:.7,bevelEnabled:true,bevelThickness:.2,bevelSize:.18,bevelSegments:3});geo.rotateX(Math.PI/2);geo.translate(0,0,-.38);
const seoul=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xf9fbfc,roughness:.72,metalness:.03}));seoul.castShadow=true;seoul.receiveShadow=true;scene.add(seoul);
const floor=new THREE.Mesh(new THREE.CircleGeometry(13,64),new THREE.ShadowMaterial({color:0x64748b,opacity:.13}));floor.rotation.x=-Math.PI/2;floor.position.z=-1.05;floor.receiveShadow=true;scene.add(floor);

const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();let drag=false,lastX=0,lastY=0,rotX=0,rotZ=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;rotZ+=(e.clientX-lastX)*.005;rotX=Math.max(-.25,Math.min(.25,rotX+(e.clientY-lastY)*.002));lastX=e.clientX;lastY=e.clientY});
renderer.domElement.addEventListener('pointerup',()=>drag=false);

function clearMarkers(){markers.forEach(m=>scene.remove(m.group));markers=[];activeMarker=null}
function addMarker(item,i){let d=districtOf(item),p=d?GU_POS[d]:[(i%5-2)*1.25,(Math.floor(i/5)%3-1)*1.2];
 const group=new THREE.Group();const h=.65+Math.min(2.4,(i%6)*.22);
 const stem=new THREE.Mesh(new THREE.CylinderGeometry(.12,.16,h,14),new THREE.MeshStandardMaterial({color:agencyColor(item.agency_group||item.agency),roughness:.35}));stem.position.set(0,0,h/2+.18);stem.castShadow=true;
 const cap=new THREE.Mesh(new THREE.SphereGeometry(.22,18,18),new THREE.MeshStandardMaterial({color:agencyColor(item.agency_group||item.agency),emissive:agencyColor(item.agency_group||item.agency),emissiveIntensity:.12}));cap.position.z=h+.2;
 group.add(stem,cap);group.position.set(p[0]+((i%3)-1)*.16,p[1]+((i%2)-.5)*.16,.34);group.rotation.x=Math.PI/2;scene.add(group);markers.push({item,group,stem,cap});
}
function emphasize(item){markers.forEach(m=>m.group.scale.setScalar(m.item===item?1.75:1));activeMarker=markers.find(m=>m.item===item)||null}

function currentQuals(){return [...document.querySelectorAll('.chip.active')].map(x=>x.dataset.qual)}
function matches(item){const region=document.getElementById('region').value,housing=document.getElementById('housing').value,state=document.getElementById('state').value,quals=currentQuals();
 if(region!=='all' && districtOf(item)!==region)return false;
 if(housing!=='all' && typeOf(item)!==housing && !(item.title||'').includes(housing) && !(item.housing_types||[]).includes(housing))return false;
 if(state==='all' && item.open_state==='마감')return false;if(!['all','all2'].includes(state) && item.open_state!==state)return false;
 const target=quals.filter(q=>q!=='무주택');if(target.length){const text=(item.title||'')+' '+(item.audiences||[]).join(' ');if(!target.some(q=>text.includes(q)||(q==='신혼부부'&&(text.includes('미리내집')||text.includes('신혼희망타운')))))return false}
 return true;
}
function tagClass(s){return s==='마감임박'?'hot':(['접수중','접수예정'].includes(s)?'open':'')}
function render(){const list=feed.filter(matches).slice(0,9);document.getElementById('summaryText').textContent=`실시간 공고 ${feed.length}건 중 조건에 맞는 후보 ${list.length}건`;
 document.getElementById('countBig').textContent=`${list.length}건`;
 const soon=list.filter(x=>x.open_state==='마감임박').length;document.getElementById('miniText').textContent=soon?`이 중 ${soon}건은 마감이 임박했습니다. 카드에서 접수일을 먼저 확인하세요.`:'마감 공고는 기본적으로 제외했습니다. 필터를 바꾸면 후보가 바로 다시 계산됩니다.';
 document.getElementById('cards').innerHTML=list.length?list.map((x,i)=>`<article class="notice" data-i="${i}"><div class="meta"><span class="tag">${x.agency_group||x.agency||'공공'}</span><span class="tag">${typeOf(x)}</span><span class="tag ${tagClass(x.open_state)}">${x.open_state||'확인필요'}</span></div><h3>${x.title}</h3><div class="dates">${districtOf(x)||'서울'} · 신청 ${fmtDate(x.application_start)}<br>마감 ${fmtDate(x.deadline)}</div></article>`).join(''):`<div style="padding:28px;color:#7a8494;font-size:13px">현재 조건에 맞는 공고가 없습니다. 오른쪽 조건을 넓혀보세요.</div>`;
 clearMarkers();list.forEach(addMarker);
 [...document.querySelectorAll('.notice')].forEach((el,i)=>el.addEventListener('click',()=>{document.querySelectorAll('.notice').forEach(n=>n.classList.remove('active'));el.classList.add('active');emphasize(list[i])}));
}
async function load(){try{const r=await fetch(FEED+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);const j=await r.json();feed=(j.items||[]).filter(x=>x&&x.title);document.getElementById('feedStatus').textContent=`실제 공고 ${feed.length}건 · ${String(j.generated_at||'').replace('T',' ')}`;render()}catch(e){document.getElementById('feedStatus').textContent='공고 피드 연결 확인 필요';feed=[];render()}}
function resize(){const el=document.getElementById('canvasWrap'),w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.qual==='무주택'){b.classList.add('active')}else b.classList.toggle('active');document.getElementById('qualText').textContent=currentQuals().filter(x=>x!=='무주택').join('·')||'기본';render()}));
['region','housing','state'].forEach(id=>document.getElementById(id).addEventListener('change',render));
(function animate(){requestAnimationFrame(animate);seoul.rotation.z=rotZ;seoul.rotation.x=rotX;markers.forEach(m=>{m.group.rotation.z=rotZ;m.group.rotation.y=rotX});if(activeMarker)activeMarker.cap.rotation.z+=.02;renderer.render(scene,camera)})();
load();
</script>
</body>
</html>
