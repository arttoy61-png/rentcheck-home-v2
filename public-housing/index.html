<body>
<main class="wrap">
  <div class="top"><a class="brand" href="/">Rent Check</a><a class="back" href="/#services">← 공공주거 캘린더</a></div>
  <div id="app"></div>
</main>
<script>
(()=>{
  const FEED='https://arttoy61-png.github.io/rent-check/public_housing_notices.json';
  const ROUTES={
    'SH:seq:309337':'/public-housing/sh-happy-housing-2026-2/',
    'SH:seq:309403':'/public-housing/sh-long-vacant-purchase-2026-2/'
  };
  const app=document.querySelector('#app');
  const id=new URLSearchParams(location.search).get('id')||'';
  if(id&&ROUTES[id]){location.replace(ROUTES[id]);return}
  const parse=v=>{const m=String(v||'').match(/(20\d{2})[-./](\d{1,2})[-./](\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
  const fmt=v=>{const d=parse(v);return d?`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`:'확인 중'};
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const status=item=>{const now=new Date();now.setHours(0,0,0,0);const s=parse(item.application_start),e=parse(item.deadline);if(e&&e<now)return'접수 마감';if(s&&s>now)return'접수 예정';if(s&&e&&s<=now&&now<=e)return e.getTime()===now.getTime()?'오늘 접수마감':'접수 중';return'일정 확인 중'};

  function renderIndex(){
    app.innerHTML=`
      <section class="hero"><p class="kicker">Rent Check 공공주거</p><h1>신규공고, 일정부터 먼저 보세요</h1><p>공고가 뜨면 신청기간·대상·자격·서류 일정을 짧게 정리합니다.</p></section>
      <div class="latest">
        <a class="notice-item" href="/public-housing/sh-happy-housing-2026-2/"><small>SH · 2026.08.28 신규</small><strong>2026년 2차 행복주택 1,484호</strong><span>9월 9~11일 신청 · 대학생·청년·신혼부부·고령자 등</span></a>
        <a class="notice-item" href="/public-housing/sh-long-vacant-purchase-2026-2/"><small>SH · 2026.08.28 신규</small><strong>2026년 2차 장기미임대 매입임대 476호</strong><span>9월 28~30일 신청 · 서울 거주 성년 무주택세대 구성원</span></a>
      </div>
      <section class="section"><h2>공고를 보는 순서</h2><ul><li>먼저 신청 가능한 날짜를 확인합니다.</li><li>그다음 내 대상·무주택·소득·자산 조건을 봅니다.</li><li>세부 조건이 애매하면 네이버 상세글 댓글 질문을 받아 보강합니다.</li></ul><div class="links"><a href="/">Rent Check 홈 →</a><a class="alt" href="/tools/youth-score/">청년임대 계산기</a></div></section>`;
  }

  function renderGeneric(item){
    document.title=`${item.title} | Rent Check`;
    const types=[...(item.housing_types||[]),...(item.audiences||[])];
    app.innerHTML=`
      <section class="hero"><p class="kicker">${esc(item.agency||item.agency_group||'공공주거')} 공고</p><h1>${esc(item.title)}</h1><p>${status(item)}</p><div class="tags">${types.slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></section>
      <div class="grid"><div class="card"><span>공고일</span><strong>${fmt(item.published_at)}</strong></div><div class="card"><span>접수 시작</span><strong>${fmt(item.application_start)}</strong></div><div class="card"><span>접수 마감</span><strong>${fmt(item.deadline)}</strong></div><div class="card"><span>지역</span><strong>${esc(item.region||'확인 중')}</strong></div></div>
      <section class="section"><h2>지금 확인할 것</h2><ul><li>신청기간 안에 접수 가능한 공고인지 먼저 확인하세요.</li><li>주택유형과 대상에 따라 무주택·소득·자산 기준이 달라질 수 있습니다.</li><li>이 공고는 아직 짧은 독립글을 만드는 중입니다. 세부 조건은 네이버 상세글에서 이어서 정리합니다.</li></ul><div class="links"><a href="/public-housing/">다른 공고 보기 →</a><a class="alt" href="/">홈으로</a></div><p class="note">Rent Check는 외부 사이트로 바로 보내기보다 내부에서 핵심 일정과 조건을 먼저 보여줍니다.</p></section>`;
  }

  if(!id){renderIndex();return}
  app.className='loading';app.textContent='공고를 불러오는 중입니다.';
  fetch(`${FEED}?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{const item=(data.items||[]).find(x=>String(x.id)===id);if(!item)throw new Error();app.className='';renderGeneric(item)}).catch(()=>{app.className='error';app.innerHTML='<strong>공고를 찾지 못했습니다.</strong><p><a href="/public-housing/">공공주거 공고 모음으로 돌아가기 →</a></p>'});
})();
</script>
