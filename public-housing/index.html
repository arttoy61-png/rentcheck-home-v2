<body>
  <main class="wrap">
    <div class="top"><a class="brand" href="/">Rent Check</a><a class="back" href="/#services">← 공공주거 캘린더</a></div>
    <div id="app" class="loading">공고를 불러오는 중입니다.</div>
  </main>
<script>
(()=>{
  const FEED='https://arttoy61-png.github.io/rent-check/public_housing_notices.json';
  const app=document.querySelector('#app');
  const id=new URLSearchParams(location.search).get('id')||'';
  const parse=v=>{const m=String(v||'').match(/(20\d{2})[-./](\d{1,2})[-./](\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
  const fmt=v=>{const d=parse(v);return d?`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`:'확인 중'};
  const short=v=>{const d=parse(v);return d?`${d.getMonth()+1}/${d.getDate()}`:''};
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const status=item=>{const now=new Date();now.setHours(0,0,0,0);const s=parse(item.application_start),e=parse(item.deadline);if(e&&e<now)return'접수 마감';if(s&&s>now)return'접수 예정';if(s&&e&&s<=now&&now<=e)return e.getTime()===now.getTime()?'오늘 접수마감':'접수 중';return'일정 확인 중'};
  function render(item){
    document.title=`${item.title} | Rent Check`;
    const types=[...(item.housing_types||[]),...(item.audiences||[])];
    const period=item.application_start||item.deadline?`${fmt(item.application_start)} ~ ${fmt(item.deadline)}`:'신청기간 확인 중';
    app.className='';
    app.innerHTML=`
      <section class="hero">
        <p class="eyebrow">${esc(item.agency||item.agency_group||'공공주거')} 공고</p>
        <h1>${esc(item.title)}</h1>
        <div class="answer"><strong>지금 가장 먼저 볼 것</strong><p>${esc(period)}</p></div>
        <div class="tags">${types.slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      </section>
      <div class="grid">
        <div class="card"><span>현재 상태</span><strong>${esc(status(item))}</strong></div>
        <div class="card"><span>공고일</span><strong>${fmt(item.published_at)}</strong></div>
        <div class="card"><span>접수 시작</span><strong>${fmt(item.application_start)}</strong></div>
        <div class="card"><span>접수 마감</span><strong>${fmt(item.deadline)}</strong></div>
      </div>
      <section class="section">
        <h2>이 공고에서 바로 확인할 것</h2>
        <ul>
          <li>신청 가능 기간: <strong>${esc(period)}</strong></li>
          <li>지역: <strong>${esc(item.region||'확인 중')}</strong></li>
          <li>주택 유형: <strong>${esc((item.housing_types||[]).join(', ')||'확인 중')}</strong></li>
          <li>대상: <strong>${esc((item.audiences||[]).join(', ')||'공고문에서 확인')}</strong></li>
        </ul>
      </section>
      <section class="section">
        <h2>신청 전 체크</h2>
        <ul>
          <li>소득·자산·무주택 여부 같은 자격은 공식 공고문을 최종 기준으로 확인하세요.</li>
          <li>접수 시작일과 마감일 사이에는 매일 신청 가능한 일정으로 캘린더에 표시합니다.</li>
          <li>마지막 날은 캘린더와 목록에서 <strong>접수마감일</strong>로 따로 표시합니다.</li>
        </ul>
        <div class="actions">
          <a class="internal" href="/#services">다른 공고도 보기 →</a>
          <a class="official" href="${esc(item.url||'#')}" target="_blank" rel="noopener noreferrer">공식 공고 원문 →</a>
        </div>
        <div class="mini-nav"><a href="/analysis/">분석 글</a><a href="/blog/">실전 가이드</a><a href="/tools/youth-score/">청년임대 계산기</a></div>
        <p class="notice">Rent Check는 공식 공고의 핵심 일정과 확인 순서를 쉽게 정리합니다. 자격과 세부 공급조건은 공식 공고문이 최종 기준입니다.</p>
      </section>`;
  }
  if(!id){app.className='error';app.innerHTML='<h1>공고를 선택해 주세요.</h1><p>홈의 공공주거 캘린더에서 공고를 선택하면 여기에서 핵심 일정을 볼 수 있습니다.</p><p><a href="/#services">공공주거 캘린더로 이동 →</a></p>';return}
  fetch(`${FEED}?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{const item=(data.items||[]).find(x=>String(x.id)===id);if(!item)throw new Error();render(item)}).catch(()=>{app.className='error';app.innerHTML='<h1>공고를 찾지 못했습니다.</h1><p>공고 목록이 갱신되었을 수 있습니다.</p><p><a href="/#services">공공주거 캘린더로 돌아가기 →</a></p>'});
})();
</script>
