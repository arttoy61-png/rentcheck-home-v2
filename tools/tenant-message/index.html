기</h1><p>상황만 고르면 바로 보낼 전월세 문장을 만들어드립니다.</p><div class="example"><strong>이런 문장을 만들 수 있어요</strong><br>안녕하세요. 계약 만료일이 다가와 재계약 가능 여부를 여쭤보려고 연락드립니다. 조건 변경이 있다면 함께 알려주시면 확인하겠습니다.</div></section><section class="card"><h2>1. 어떤 입장인가요?</h2><p class="lead">문자를 보내는 사람을 고르세요.</p><div class="roles" id="roles"><button class="active" data-role="tenant">세입자<small> · 임차인</small></button><button data-role="landlord">집주인<small> · 임대인</small></button></div><div class="situations" id="situations"></div><div class="form"><div class="field"><label for="unit">집 표시</label><input id="unit" placeholder="예: 101호"></div><div class="field"><label for="name">내 이름</label><input id="name" placeholder="예: 김민수"></div><div class="field"><label for="date">계약 만료일·요청일</label><input id="date" placeholder="예: 2026년 12월 31일"></div><div class="field full"><label for="detail">금액·수리내용·조건 등</label><input id="detail" placeholder="예: 보일러가 작동하지 않습니다 / 보증금 2억원"></div></div><button class="make" id="make">문자 만들기</button></section><section class="result" id="result"><h2>바로 보낼 문장</h2><p class="lead">필요하면 문구를 직접 고쳐서 보내세요.</p><textarea id="message"></textarea><button class="copy" id="copy">문자 복사하기</button><p class="tip">계약갱신요구권·실거주 갱신거절·보증금 반환처럼 법적 효과가 생길 수 있는 문자는 계약일과 통지 시기를 함께 확인하세요.</p></section></main><script>(()=>{const sets={tenant:[['renew','재계약 문의'],['renewRight','갱신요구권'],['repair','수리 요청'],['move','퇴거·보증금 반환'],['deposit','보증금 반환 일정'],['other','기타 요청']],landlord:[['renew','재계약 의사 확인'],['move','퇴거 여부 확인'],['rent','월세 미납'],['visit','방문 일정 요청'],['real','실거주 예정 안내'],['other','기타 안내']]};let role='tenant',situation='renew';const $=s=>document.querySelector(s);function draw(){const box=$('#situations');box.innerHTML=sets[role].map(([v,t],i)=>`<button data-s="${v}" class="${i===0?'active':''}">${t}</button>`).join('');situation=sets[role][0][0]}$('#roles').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;role=b.dataset.role;[...$('#roles').children].forEach(x=>x.classList.toggle('active',x===b));draw()});$('#situations').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;situation=b.dataset.s;[...$('#situations').children].forEach(x=>x.classList.toggle('active',x===b))});function text(){const unit=$('#unit').value.trim(),date=$('#date').value.trim(),detail=$('#detail').value.trim();const u=unit?`${unit} 관련해 `:'';const d=date?` ${date} 기준으로`:'';const det=detail?` ${detail}`:'';if(role==='tenant'){if(situation==='renew')return`안녕하세요. ${u}계약 만료일이 다가와 재계약 가능 여부를 여쭤보려고 연락드립니다.${detail?` 조건이나 변경사항은 ${detail} 기준으로 협의하고 싶습니다.`:' 조건 변경이 있다면 함께 알려주시면 확인하겠습니다.'}`;if(situation==='renewRight')return`안녕하세요. ${u}계약갱신을 요청드리려고 연락드립니다.${date?` 계약 만료일은 ${date}입니다.`:''} 갱신 조건과 필요한 절차를 확인 부탁드립니다.`;if(situation==='repair')return`안녕하세요. ${u}수리가 필요한 부분이 있어 연락드립니다.${det||' 확인 후 수리 가능한 일정을 알려주시면 감사하겠습니다.'}`;if(situation==='move')return`안녕하세요. ${u}${date?`${date} 계약 만료에 맞춰 퇴거할 예정입니다.`:'계약 만료에 맞춰 퇴거할 예정입니다.'}${detail?` 보증금 반환 관련해 ${detail} 확인 부탁드립니다.`:' 보증금 반환 일정도 함께 확인 부탁드립니다.'}`;if(situation==='deposit')return`안녕하세요. ${u}보증금 반환 일정 확인차 연락드립니다.${d}${det} 반환 가능한 날짜를 알려주시면 일정 준비하겠습니다.`;return`안녕하세요. ${u}확인드릴 내용이 있어 연락드립니다.${det} 가능하실 때 답변 부탁드립니다.`}if(situation==='renew')return`안녕하세요. ${u}계약 만료일이 다가와 향후 거주 계획을 확인드리려고 연락드립니다.${date?` 만료일은 ${date}입니다.`:''} 재계약 또는 퇴거 예정 여부를 알려주시면 일정 준비에 참고하겠습니다.`;if(situation==='move')return`안녕하세요. ${u}계약 만료 관련해 퇴거 여부를 미리 확인드리려고 연락드립니다.${date?` ${date}까지`:''} 거주 계획을 알려주시면 감사하겠습니다.`;if(situation==='rent')return`안녕하세요. ${u}월세 납부 내역 확인차 연락드립니다.${detail?` 현재 확인되는 미납 내용은 ${detail}입니다.`:''}${date?` ${date}까지 확인 부탁드립니다.`:' 확인 후 답변 부탁드립니다.'}`;if(situation==='visit')return`안녕하세요. ${u}점검 또는 방문 일정 협의를 위해 연락드립니다.${date?` 희망 일정은 ${date}입니다.`:''}${detail?` 방문 목적은 ${detail}입니다.`:''} 가능한 시간을 알려주세요.`;if(situation==='real')return`안녕하세요. ${u}계약 만료 후 실거주 계획과 관련해 미리 안내드립니다.${date?` 예정 시점은 ${date}입니다.`:''}${det} 계약 일정 확인을 위해 연락드립니다.`;return`안녕하세요. ${u}안내드릴 내용이 있어 연락드립니다.${det} 확인 후 답변 부탁드립니다.`}$('#make').addEventListener('click',()=>{const msg=text();$('#message').value=msg;$('#result').classList.add('show');gtag('event','tenant_message_make',{role,situation})});$('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('#message').value);$('#copy').textContent='복사했습니다'}catch{$('#message').select();document.execCommand('copy')}});draw()})();</script><script type="text/javascript" src="//wcs.pstatic.net/wcslog.js"></script><script>if(!wcs_add)var wcs_add={};wcs_add['wa']='1a98778bd0f06a0';if(window.wcs)wcs_do();</script></body></html>
