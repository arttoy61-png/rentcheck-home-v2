</head><body class="v2-tool-page" data-v2-root="../../" data-tool-id="registration-cost"><main class="page"><section class="hero"><p class="eyebrow">등기비용</p><h1>등기비용 합산기</h1><p>공식 조회·견적 금액을 한곳에 넣어 등기 준비비용을 합산합니다.</p></section><section class="card"><div class="form"><div class="field"><label for="price">매매·취득가액</label><div class="input"><input id="price" inputmode="decimal" placeholder="예: 75000"><span>만원</span></div></div><div class="field"><label for="tax">취득세·부가세목 합계</label><div class="input"><input id="tax" inputmode="decimal" placeholder="공식 확인 금액"><span>만원</span></div></div><div class="field"><label for="bond">국민주택채권 즉시매도 실제 부담액</label><div class="input"><input id="bond" inputmode="decimal" placeholder="조회 금액"><span>만원</span></div></div><div class="field"><label for="legal">법무사·등기 대행비</label><div class="input"><input id="legal" inputmode="decimal" placeholder="견적 금액"><span>만원</span></div></div><div class="field"><label for="docs">인지·증지·서류비</label><div class="input"><input id="docs" inputmode="decimal" placeholder="예: 20"><span>만원</span></div></div><div class="field"><label for="other">기타 비용</label><div class="input"><input id="other" inputmode="decimal" placeholder="예: 0"><span>만원</span></div></div></div><div class="note">이 도구는 법정 요율을 임의 추정하지 않습니다. 취득세는 위택스 등 공식 확인 금액, 국민주택채권은 주택도시기금 조회 금액, 법무사비는 실제 견적을 입력하세요.</div><button class="calculate" id="calculate" type="button">등기 준비비용 합산하기</button></section><section class="result" id="result"><div class="main"><small>입력한 등기 준비비용 합계</small><strong id="total">-</strong></div><div class="grid"><div class="stat"><span>취득세 등</span><b id="taxOut">-</b></div><div class="stat"><span>채권 부담액</span><b id="bondOut">-</b></div><div class="stat"><span>법무사·등기비</span><b id="legalOut">-</b></div><div class="stat"><span>서류·기타</span><b id="otherOut">-</b></div></div></section><section class="basis"><h3>확인할 곳</h3><p>취득세와 감면은 위택스 등 공식 세금 안내에서, 국민주택채권 부담액은 주택도시기금에서 확인한 뒤 입력하세요.</p><p><a href="https://nhuf.molit.go.kr/FP/FP03/FP0301.jsp" tar
