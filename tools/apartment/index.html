function renderDetail(){const load=DET?Promise.resolve(DET):fetch('https://arttoy61-png.github.io/rent-check/gangseo_apt_detail.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>DET=d);$('#view').className='ld';$('#view').textContent='단지 상세 불러오는 중…';load.then(()=>{const d=DET[state.id];if(!d){$('#view').textContent='단지 정보를 찾지 못했습니다.';return}DET_CUR=d;setCrumb();const sm=S.complexes.find(c=>c.id===state.id)||{};if(!d._band)d._band=d.areas[0].m2;if(!d._tab)d._tab='sale';const a=d.areas.find(x=>x.m2===d._band)||d.areas[0];let h='<div class="det"><h2>'+d.nm+'</h2><div class="meta">'+d.dong+' · '+(d.yr?d.yr+'년 준공':'준공연도 미상')+(sm.un?' · '+sm.un.toLocaleString()+'세대':'')+'</div>';h+='<div class="bands">'+d.areas.map(x=>'<button class="'+(x.m2===a.m2?'on':'')+'" onclick="setBand('+x.m2+')">전용 '+x.m2+'㎡</button>').join('')+'</div>';const tabs=[['sale','매매 '+a.nS],['jeonse','전세 '+a.nJ],['wolse','월세 '+a.nW]];h+='<div class="tabs">'+tabs.map(t=>'<button class="'+(d._tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>';h+=dealBlock(a,d._tab);if(sm.lat)h+='<div id="map"></div>';h+='<div class="note">국토부 실거래 신고분입니다. 같은 면적이라도 층·동·수리 상태에 따라 가격이 다를 수 있습니다.'+(a.nS<7?' 표본이 적어 참고용으로만 봐주세요.':'')+'</div><button class="back" onclick="goList(\''+d.dong+'\')">‹ '+d.dong+' 단지 목록으로</button></div>';$('#view').className='detpad';$('#view').innerHTML=h;const cnt=({sale:a.nS,jeonse:a.nJ,wolse:a.nW})[d._tab]-5;$('#fixbar').className='fixbar on';$('#fixbar').innerHTML=(!state.deals&&cnt>0?'<button class="mo" onclick="state.deals=1;render()">+ '+cnt+'건 더보기</button>':'')+'<a class="db" href="../../#article-library">분석 글</a>';if(sm.lat)miniMap(sm.lat,sm.lng,d.nm);ga('apt_click',{apt:d.nm,dong:d.dong})}).catch(()=>{$('#view').textContent='단지 상세 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'})}
function setBand(m2){DET[state.id]._band=m2;state.deals=0;render()}function setTab(t){DET[state.id]._tab=t;state.deals=0;render()}function cut(arr){return state.deals?arr:arr.slice(0,5)}function dealBlock(a,tab){let mid='',rows='',head='';if(tab==='sale'){mid='<div class="kv"><span>중위 <b>'+(a.mid!=null?eok(a.mid):'-')+'</b> ('+a.m2+'㎡ 기준)</span>'+(a.ppy?'<span>전용 평당 <b>'+Math.round(a.ppy*10000).toLocaleString()+'만</b> ('+a.m2+'㎡ 기준)</span>':'')+'</div>';head='<tr><th>계약일</th><th>전용면적</th><th>층</th><th>금액</th></tr>';rows=cut(a.sale).map(x=>'<tr><td class="dt">'+x.date+'</td><td class="area">'+areaText(x.m2)+'</td><td>'+(x.fl||'-')+'층</td><td><b>'+eok(x.amt)+'</b></td></tr>').join('');if(!a.sale.length)rows='<tr><td colspan="4" class="dt">최근 6개월 매매가 없습니다</td></tr>'}else if(tab==='jeonse'){const deps=a.jeonse.map(x=>x.dep).filter(Boolean),m=deps.length>=3?median(deps):null;mid='<div class="kv"><span>전세 중위 <b>'+(m!=null?eok(m):'-')+'</b></span></div>';head='<tr><th>계약일</th><th>전용면적</th><th>층</th><th>보증금</th></tr>';rows=cut(a.jeonse).map(x=>'<tr><td class="dt">'+x.date+'</td><td class="area">'+areaText(x.m2)+'</td><td>'+(x.fl||'-')+'층</td><td><b>'+eok(x.dep)+'</b></td></tr>').join('');if(!a.jeonse.length)rows='<tr><td colspan="4" class="dt">최근 6개월 전세가 없습니다</td></tr>'}else{head='<tr><th>계약일</th><th>전용면적</th><th>층</th><th>보증금 / 월세</th></tr>';rows=cut(a.wolse).map(x=>'<tr><td class="dt">'+x.date+'</td><td class="area">'+areaText(x.m2)+'</td><td>'+(x.fl||'-')+'층</td><td>'+eok(x.dep)+' / <b>'+x.rent+'만</b></td></tr>').join('');if(!a.wolse.length)rows='<tr><td colspan="4" class="dt">최근 6개월 월세가 없습니다</td></tr>'}return mid+'<table class="deals"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table>'}function median(a){const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}function miniMap(lat,lng,nm){if(typeof window.__rentcheckKakaoMiniMap==='function')return window.__rentcheckKakaoMiniMap(lat,lng,nm)}document.addEventListener('click',e=>{if(!e.target.closest('.search')&&!e.target.closest('.sres'))$('#sres').classList.add('hide')});
