function aptCard(c,k,rk){const TY={sale:['매매','sale'],je:['전세','je'],wo:['월세','wo']},badge=rk?'<div class="rank'+(rk<=3?' gold':'')+'">'+rk+'</div>':'',head='<div class="top" style="display:flex;align-items:flex-start">'+badge+'<div style="flex:1"><div class="nm">'+c.nm+'</div><div class="meta">'+c.dong+' · '+(c.yr?c.yr+'년':'준공 미상')+(c.un?' · '+c.un.toLocaleString()+'세대':'')+'</div></div>';if(k==='recent'&&c.rc){const r=c.rc,tn=TY[r.t][0],tc=TY[r.t][1],amt=r.t==='wo'?eok(r.a)+' / '+r.r+'만':eok(r.a);return'<div class="card ac" onclick="goDetail(\''+c.id+'\')">'+head+'<div style="text-align:right"><div class="rcamt '+tc+'">'+amt+'</div><div style="font-size:11.5px;color:#98a4b1;font-weight:700">'+tn+' 실거래</div></div></div><div class="rcline"><span class="led"></span><span class="rdate">'+r.d.slice(5)+'</span><span class="ttag '+tc+'">'+tn+'</span><span class="rspec">'+r.m2+'㎡ ('+Math.round(r.m2/3.3058)+'평)'+(r.fl?' · '+r.fl+'층':'')+'</span></div><div class="hint">누르시면 층·평형별 실거래 ›</div></div>'}const last=c.last?'<b>'+eok(c.last.amt)+'</b><span class="d">'+c.last.date.slice(2)+'</span>':'<b style="color:#98a4b1;font-size:13px">매매 없음</b>',mid=c.mid!=null?eok(c.mid):'<span style="color:#98a4b1">표본부족</span>',ppy=c.ppy!=null?Math.round(c.ppy*10000).toLocaleString()+'만':'-';return'<div class="card ac" onclick="goDetail(\''+c.id+'\')">'+head+'<div class="last">'+last+'</div></div><div class="grid"><div class="g"><div class="k">대표 '+c.m2+'㎡ ('+Math.round(c.py)+'평)</div><div class="v">'+mid+'</div></div><div class="g"><div class="k">전용 평당</div><div class="v">'+ppy+'</div></div><div class="g"><div class="k">전세가율</div><div class="v gold">'+(c.ratio!=null?c.ratio+'%':'-')+'</div></div><div class="g"><div class="k">6개월 거래</div><div class="v">'+c.tot+'건</div></div></div><div class="hint">누르시면 층·평형별 실거래 ›</div></div>'}
