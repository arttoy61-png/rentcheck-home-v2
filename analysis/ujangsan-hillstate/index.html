<title>우장산힐스테이트 실거래 분석 | Rent Check</title>
<meta name="description" content="우장산힐스테이트 매매·전세·월세 실거래를 면적별로 자동 분석합니다. 국토교통부 실거래 신고분 기준으로 매일 갱신됩니다.">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MPRR3J99YQ"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-MPRR3J99YQ');</script>
<style>
:root{--navy:#0d1f3c;--blue:#1565c0;--gold:#d4a73a;--bg:#faf8f3;--paper:#fff;--ink:#111;--muted:#667085;--line:#d7dce3;--soft:#f4efe4;--green:#287a50;--orange:#c4661f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55}.wrap{max-width:720px;margin:0 auto;padding:14px 12px 44px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top a{font-size:13px;font-weight:800;color:var(--blue);text-decoration:none}.brand{font-size:12px;font-weight:900;color:var(--navy)}.hero{background:linear-gradient(135deg,#0d1f3c,#17406e);border-radius:16px;padding:20px 17px;color:#fff}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#ead89f;font-weight:800}.hero h1{font-size:22px;line-height:1.3;margin:6px 0 5px;letter-spacing:-.5px}.hero .meta{font-size:12.5px;color:#d7e0ec}.updated{font-size:11.5px;color:#d7e0ec;margin-top:8px}.answer{margin-top:10px;background:#fff;border:2px solid var(--gold);border-radius:14px;padding:14px 15px}.answer .k{font-size:12px;font-weight:900;color:#9a6d0b;margin-bottom:5px}.answer .v{font-size:16px;font-weight:900;color:var(--navy);line-height:1.55}.bands{display:flex;gap:7px;overflow-x:auto;margin:12px 0 10px;padding-bottom:2px}.bands::-webkit-scrollbar{display:none}.bands button{flex-shrink:0;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;min-height:40px;font-weight:800;font-size:13px;cursor:pointer}.bands button.on{background:var(--navy);border-color:var(--navy);color:#fff}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px}.card .k{font-size:11px;color:var(--muted);font-weight:800}.card .v{font-size:18px;color:var(--navy);font-weight:900;margin-top:3px}.card .s{font-size:10.5px;color:var(--muted);margin-top:2px}.tabs{display:flex;gap:6px;margin:12px 0 8px}.tabs button{flex:1;min-height:42px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:13px;font-weight:900;color:var(--muted);cursor:pointer}.tabs button.on{border-color:var(--gold);background:#fff9e9;color:#8c6508}.panel{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px}.panel h2{font-size:16px;color:var(--navy);margin:0 0 10px}.mix{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mix .it{border:1px solid #e6e9ee;border-radius:10px;padding:10px;text-align:center}.mix .it b{display:block;font-size:18px;color:var(--navy)}.mix .it span{font-size:11px;color:var(--muted)}.insight{margin-top:10px;background:var(--soft);border-left:4px solid var(--gold);padding:11px 12px;font-size:13px;line-height:1.7}.trend{width:100%;border-collapse:collapse;font-size:12.5px}.trend th{background:var(--navy);color:#fff;padding:8px 5px}.trend td{padding:8px 5px;border-bottom:1px solid #eee;text-align:center}.trend td:first-child{text-align:left}.compare{display:grid;gap:7px}.cmp{border:1px solid #e6e9ee;border-radius:10px;padding:10px 11px;display:flex;justify-content:space-between;gap:10px;align-items:center}.cmp .nm{font-size:13px;font-weight:900;color:var(--navy)}.cmp .sub{font-size:11px;color:var(--muted);margin-top:2px}.cmp .amt{text-align:right;font-size:13px;font-weight:900;color:var(--navy)}.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:10px}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.links a{min-height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:13px;font-weight:900}.links .primary{background:var(--navy);color:#f0c75e}.links .secondary{background:#fff;border:1.5px solid var(--blue);color:var(--blue)}.loading{text-align:center;padding:40px 10px;color:var(--muted);font-size:14px}.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:15px;line-height:1.8}@media(min-width:620px){.cards{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../../tools/apartment/">‹ 아파트 실거래</a><div class="brand">Rent Check 강서</div></div>
  <div class="hero">
    <div class="eyebrow">LIVE APARTMENT ANALYSIS</div>
    <h1>우장산힐스테이트 실거래 분석</h1>
    <div class="meta">내발산동 · 2005년 준공 · 2,198세대</div>
    <div class="updated" id="updated">실거래 데이터 불러오는 중…</div>
  </div>
  <div id="app" class="loading">분석 데이터를 불러오는 중입니다…</div>
  <div class="links">
    <a class="secondary" id="rawLink" href="../../tools/apartment/">실거래 원본 보기</a>
    <a class="primary" href="../../">Rent Check 홈</a>
  </div>
  <div class="foot">자료 · 국토교통부 실거래가 공개시스템 · 계약일 기준<br>신고 지연으로 최근 거래는 계속 추가될 수 있습니다.</div>
</div>
<script>
const TARGET='우장산힐스테이트';
const SUM='https://arttoy61-png.github.io/rent-check/gangseo_apt_summary.json';
const DET='https://arttoy61-png.github.io/rent-check/gangseo_apt_detail.json';
let S,D,SM,APT,band,tab='analysis';
const $=s=>document.querySelector(s);
const norm=s=>String(s||'').replace(/[,\s·()]/g,'').toLowerCase();
const eok=v=>v==null?'-':(v<1?Math.round(v*10000).toLocaleString()+'만원':Number(v).toFixed(v>=10?1:2).replace(/\.?0+$/,'')+'억');
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const monthKey=d=>String(d||'').slice(0,7).replace('.','');
function months6(ym){let y=+ym.slice(0,4),m=+ym.slice(4,6),out=[];for(let i=5;i>=0;i--){let mm=m-i,yy=y;while(mm<=0){mm+=12;yy--}out.push(String(yy)+String(mm).padStart(2,'0'))}return out}
function rows6(arr,months){const set=new Set(months);return (arr||[]).filter(x=>set.has(monthKey(x.date)))}
function formatMonth(ym){return ym.slice(0,4)+'.'+ym.slice(4)}
function pct(a,b){return b?((a-b)/b*100):null}
function coreData(a){const months=months6(S.meta.updated),sale=rows6(a.sale,months),je=rows6(a.jeonse,months),wo=rows6(a.wolse,months);const first3=new Set(months.slice(0,3)),last3=new Set(months.slice(3));const s1=(a.sale||[]).filter(x=>first3.has(monthKey(x.date))).map(x=>x.amt),s2=(a.sale||[]).filter(x=>last3.has(monthKey(x.date))).map(x=>x.amt);return{months,sale,je,wo,saleMed:median(sale.map(x=>x.amt)),jeMed:median(je.map(x=>x.dep)),lastSale:sale[0]||null,prev3:median(s1),last3:median(s2)}}
function insightText(a,c){const counts=[['매매',c.sale.length],['전세',c.je.length],['월세',c.wo.length]].sort((x,y)=>y[1]-x[1]);let t='최근 6개월 '+a.m2+'㎡는 '+counts[0][0]+' 거래가 '+counts[0][1]+'건으로 세 유형 중 가장 많습니다.';if(c.prev3!=null&&c.last3!=null){const p=pct(c.last3,c.prev3);if(Math.abs(p)<2)t+=' 최근 3개월 매매 중위는 직전 3개월과 비슷한 수준입니다.';else t+=' 최근 3개월 매매 중위는 직전 3개월보다 약 '+Math.abs(p).toFixed(1)+'% '+(p>0?'높습니다.':'낮습니다.')}else t+=' 매매 표본이 충분하지 않아 단기 방향은 단정하지 않습니다.';return t}
function render(){const a=APT.areas.find(x=>x.m2===band)||APT.areas[0],c=coreData(a);let html='<div class="answer"><div class="k">지금 핵심</div><div class="v">'+insightText(a,c)+'</div></div>';
html+='<div class="bands">'+APT.areas.map(x=>'<button class="'+(x.m2===a.m2?'on':'')+'" onclick="setBand('+x.m2+')">전용 '+x.m2+'㎡</button>').join('')+'</div>';
html+='<div class="cards"><div class="card"><div class="k">6개월 매매 중위</div><div class="v">'+eok(c.saleMed)+'</div><div class="s">'+c.sale.length+'건 기준</div></div><div class="card"><div class="k">6개월 전세 중위</div><div class="v">'+eok(c.jeMed)+'</div><div class="s">'+c.je.length+'건 기준</div></div><div class="card"><div class="k">최근 매매</div><div class="v">'+(c.lastSale?eok(c.lastSale.amt):'-')+'</div><div class="s">'+(c.lastSale?c.lastSale.date+' · '+(c.lastSale.fl||'-')+'층':'최근 6개월 없음')+'</div></div><div class="card"><div class="k">6개월 총 거래</div><div class="v">'+(c.sale.length+c.je.length+c.wo.length)+'건</div><div class="s">매매·전세·월세 합계</div></div></div>';
html+='<div class="tabs"><button class="'+(tab==='analysis'?'on':'')+'" onclick="setTab(\'analysis\')">분석</button><button class="'+(tab==='trend'?'on':'')+'" onclick="setTab(\'trend\')">6개월 흐름</button><button class="'+(tab==='compare'?'on':'')+'" onclick="setTab(\'compare\')">주변 비교</button></div>';
html+='<div class="panel">'+panel(a,c)+'</div>';$('#app').className='';$('#app').innerHTML=html}
function panel(a,c){if(tab==='analysis'){const p=(c.prev3!=null&&c.last3!=null)?pct(c.last3,c.prev3):null;return '<h2>'+a.m2+'㎡ 거래 구조</h2><div class="mix"><div class="it"><b>'+c.sale.length+'</b><span>매매</span></div><div class="it"><b>'+c.je.length+'</b><span>전세</span></div><div class="it"><b>'+c.wo.length+'</b><span>월세</span></div></div><div class="insight">'+(p==null?'매매 표본이 적어 3개월 전후 흐름 비교는 보류합니다.':'최근 3개월 매매 중위 '+eok(c.last3)+' · 직전 3개월 '+eok(c.prev3)+' · 변화 '+(p>=0?'+':'')+p.toFixed(1)+'%')+'</div><div class="note">같은 전용면적이라도 동·층·향·수리 상태에 따라 실제 가격 차이가 있습니다. 이 페이지는 개별 매물의 적정가를 확정하지 않습니다.</div>'}
if(tab==='trend'){let rows=c.months.map(m=>{const r=(a.sale||[]).filter(x=>monthKey(x.date)===m),med=median(r.map(x=>x.amt));return '<tr><td>'+formatMonth(m)+'</td><td>'+r.length+'건</td><td><b>'+(med==null?'-':eok(med))+'</b></td></tr>'}).join('');return '<h2>'+a.m2+'㎡ 매매 6개월 흐름</h2><table class="trend"><thead><tr><th>월</th><th>거래</th><th>중위</th></tr></thead><tbody>'+rows+'</tbody></table><div class="note">거래가 없는 달은 ‘-’로 표시합니다. 한두 건만 있는 달은 가격 방향을 판단하기보다 실제 계약 확인용으로 보세요.</div>'}
const target=SM,near=S.complexes.filter(x=>x.dong===SM.dong&&x.id!==SM.id&&x.mid!=null).sort((x,y)=>(Math.abs((x.m2||0)-a.m2)-Math.abs((y.m2||0)-a.m2))||((y.tot||0)-(x.tot||0))).slice(0,4);return '<h2>내발산동 비슷한 면적 단지</h2><div class="compare">'+near.map(x=>'<div class="cmp"><div><div class="nm">'+x.nm+'</div><div class="sub">대표 '+x.m2+'㎡ · '+(x.yr||'-')+'년</div></div><div class="amt">'+eok(x.mid)+'</div></div>').join('')+'</div><div class="note">주변 비교는 각 단지의 대표면적 중위값입니다. 면적·연식·동별 조건이 달라 직접적인 우열이나 매수 판단 기준으로 사용하지 않습니다.</div>'}
function setBand(v){band=v;render();try{gtag('event','apt_analysis_band',{apt:TARGET,m2:v})}catch(e){}}
function setTab(v){tab=v;render();try{gtag('event','apt_analysis_tab',{apt:TARGET,tab:v})}catch(e){}}
Promise.all([fetch(SUM,{cache:'no-cache'}).then(r=>r.json()),fetch(DET,{cache:'no-cache'}).then(r=>r.json())]).then(([s,d])=>{S=s;D=d;SM=S.complexes.find(x=>norm(x.nm)===norm(TARGET));if(!SM)throw new Error('summary not found');APT=D[SM.id];if(!APT)throw new Error('detail not found');band=APT.areas[0].m2;$('#rawLink').href='../../tools/apartment/?id='+encodeURIComponent(SM.id);const gd=S.generated_at?new Date(S.generated_at):null;$('#updated').textContent='최근 데이터 '+(gd&&!isNaN(gd)?gd.toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}):S.meta.updated)+' · 자동 갱신';render()}).catch(e=>{$('#app').className='loading';$('#app').textContent='분석 데이터를 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.';$('#updated').textContent='데이터 연결 확인 필요'});
</script>
</body>
</html>
