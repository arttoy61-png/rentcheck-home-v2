<style>
:root{--navy:#0d1f3c;--blue:#1565c0;--gold:#d4a73a;--paper:#fff;--ink:#111;--muted:#667085;--line:#d7dce3;--soft:#f7f8fa}
*{box-sizing:border-box}
.apartment-detail-hero .v2-hero-brand{position:relative;z-index:2;margin:0 0 8px;color:var(--gold);font-size:12px;font-weight:700;line-height:1.35;letter-spacing:.01em}
body.v2-tool-page .apartment-detail-hero h1{position:relative;z-index:2;margin:0;color:#fff;font-size:28px!important;font-weight:700;line-height:1.35!important;letter-spacing:-.035em}
body.v2-tool-page .apartment-detail-hero .hero-detail-meta{position:relative;z-index:2;margin:8px 0 0;color:#d6dde6;font-size:14px!important;line-height:1.7!important}
body.v2-tool-page .apartment-detail-hero .hero-updated{position:relative;z-index:2;margin:5px 0 0;color:#bfc9d6;font-size:12px!important;line-height:1.6!important}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.crumb a{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:7px 13px;border-radius:999px;font-weight:700;text-decoration:none;cursor:pointer}
.crumb .sep{color:#b09f7a}.crumb .cur{padding:0 3px;color:#fff;font-weight:700}
.answer{margin:0 0 14px;padding:17px 18px;border:1px solid #e3cc7d;border-left:4px solid var(--gold);border-radius:14px;background:#fffaf0;box-shadow:0 10px 30px rgba(13,31,60,.06)}
.answer .k{margin-bottom:5px;color:#7d6118;font-size:12px;font-weight:700}
.answer .v{color:var(--navy);font-size:16px;font-weight:700;line-height:1.65}
.bands{display:flex;gap:7px;overflow-x:auto;margin:0 0 12px;padding:2px 0;-webkit-overflow-scrolling:touch}
.bands::-webkit-scrollbar{display:none}
.bands button{flex-shrink:0;min-height:40px;padding:7px 13px;border:1.5px solid var(--line);border-radius:99px;background:var(--paper);color:#52606e;font-size:13.5px;font-weight:700;white-space:nowrap;cursor:pointer}
.bands button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
body[data-tool-id="apartment"] .cards .card{min-width:0;margin:0;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 30px rgba(13,31,60,.07)}
.card .k{color:var(--muted);font-size:11px;font-weight:700}
.card .v{margin-top:4px;color:var(--navy);font-size:18px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.card .s{margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.55}
.tabs{display:flex;gap:6px;margin:14px 0 8px}
.tabs button{flex:1;min-height:42px;padding:7px 8px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:#52606e;font-size:13.5px;font-weight:700;cursor:pointer}
.tabs button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.panel{padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 10px 30px rgba(13,31,60,.07)}
.panel h2{margin:0 0 12px;color:var(--navy);font-size:17px;font-weight:700}
.mix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mix .it{padding:11px 8px;border:1px solid #e6e9ee;border-radius:11px;background:#f8f9fa;text-align:center}
.mix .it b{display:block;color:var(--navy);font-size:18px}
.mix .it span{color:var(--muted);font-size:11px}
.insight{margin-top:12px;padding:12px 13px;border-left:4px solid var(--gold);border-radius:0 10px 10px 0;background:var(--soft);font-size:13px;line-height:1.7}
.trend{width:100%;border-collapse:collapse;font-size:12.5px}
.trend th{padding:8px 5px;background:var(--navy);color:#fff}
.trend td{padding:8px 5px;border-bottom:1px solid #eee;text-align:center}
.trend td:first-child{text-align:left}
.compare{display:grid;gap:8px}
.cmp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid #e6e9ee;border-radius:11px;background:#f8f9fa;color:inherit;text-decoration:none;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.cmp:hover{border-color:#9fb5cc;background:#fff;transform:translateY(-1px)}
.cmp:focus-visible{outline:3px solid rgba(21,101,192,.2);outline-offset:2px}
.cmp .nm{color:var(--navy);font-size:13px;font-weight:700}
.cmp .sub{margin-top:2px;color:var(--muted);font-size:11px}
.cmp .amt{color:var(--navy);font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
.cmp .amt small{display:block;color:var(--muted);font-size:10px;font-weight:700}
.cmp .go{display:block;margin-top:3px;color:var(--blue);font-size:10px;font-weight:700}
.warn{margin-top:10px;padding:10px 11px;border:1px solid #eadba7;border-radius:10px;background:#fff7df;color:#8a5d00;font-size:12px}
.note{margin-top:10px;color:var(--muted);font-size:11.5px;line-height:1.7}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.links a{display:flex;align-items:center;justify-content:center;min-height:46px;padding:9px 12px;border-radius:12px;font-size:13.5px;font-weight:700;text-decoration:none}
.links .primary{border:1.5px solid var(--navy);background:var(--navy);color:#fff}
.links .secondary{border:1.5px solid var(--line);background:#fff;color:var(--blue)}
.source-notes{width:100%;margin:22px 0 0;padding:18px 24px;border:1px solid var(--line);border-radius:12px;background:#f7f8fa;color:var(--muted);font-size:11px;line-height:1.75;text-align:center}
.source-notes p{margin:2px 0}
.loading{padding:44px 10px;color:var(--muted);font-size:14px;text-align:center}
@media(min-width:620px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:560px){body.v2-tool-page .apartment-detail-hero h1{font-size:23px!important}.apartment-detail-hero .hero-detail-meta{font-size:13px!important}.panel{padding:16px 12px}.trend{font-size:11.5px}.trend th,.trend td{padding:8px 3px}.links{grid-template-columns:1fr}.source-notes{padding:16px}}
</style>

<script>
const SUM='https://arttoy61-png.github.io/rent-check/gangseo_apt_summary.json';
const DET='https://arttoy61-png.github.io/rent-check/gangseo_apt_detail.json';
const id=new URLSearchParams(location.search).get('id');
let S,D,SM,APT,band,tab='summary';
const $=s=>document.querySelector(s);
const eok=v=>v==null?'-':(v<1?Math.round(v*10000).toLocaleString()+'만원':Number(v).toFixed(v>=10?1:2).replace(/\.?0+$/,'')+'억');
const median=a=>{const s=(a||[]).filter(v=>Number.isFinite(Number(v))).map(Number).sort((x,y)=>x-y);if(!s.length)return null;const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const monthKey=d=>String(d||'').replaceAll('.','-').slice(0,7).replace('-','');
function months6(ym){ym=String(ym||'').replace(/\D/g,'').slice(0,6);if(ym.length!==6)return[];let y=+ym.slice(0,4),m=+ym.slice(4,6),out=[];for(let i=5;i>=0;i--){let mm=m-i,yy=y;while(mm<=0){mm+=12;yy--}out.push(String(yy)+String(mm).padStart(2,'0'))}return out}
function rows6(arr,months){const set=new Set(months);return (arr||[]).filter(x=>set.has(monthKey(x.date)))}
function latest(arr){return [...(arr||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||null}
function distM(lat1,lng1,lat2,lng2){const R=6371000,p1=lat1*Math.PI/180,p2=lat2*Math.PI/180,dp=(lat2-lat1)*Math.PI/180,dl=(lng2-lng1)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function core(a){const months=months6(S?.meta?.updated||new Date().toISOString().slice(0,7)),sale=rows6(a.sale,months),je=rows6(a.jeonse,months),wo=rows6(a.wolse,months),saleMed=sale.length>=3?median(sale.map(x=>x.amt)):null,jeMed=je.length>=3?median(je.map(x=>x.dep)):null;return{months,sale,je,wo,saleMed,jeMed,lastSale:latest(sale),lastJe:latest(je),lastWo:latest(wo),ratio:(saleMed&&jeMed)?Math.round(jeMed/saleMed*1000)/10:null}}
function insight(a,c){if(c.sale.length<3&&c.je.length<3&&c.wo.length<3)return '최근 6개월 거래 표본이 적습니다. 최근 실제 계약은 볼 수 있지만 대표가격이나 방향은 단정하지 않습니다.';let t=[];if(c.lastSale)t.push('최근 매매 '+eok(c.lastSale.amt));if(c.saleMed!=null)t.push('6개월 매매 대표가격 '+eok(c.saleMed));if(c.ratio!=null)t.push('전세가율 '+c.ratio+'%');return t.length?t.join(' · ')+'.':'최근 6개월 거래를 유형별로 확인하세요.'}
function monthly(a,c){return c.months.map(m=>{const s=c.sale.filter(x=>monthKey(x.date)===m),j=c.je.filter(x=>monthKey(x.date)===m),w=c.wo.filter(x=>monthKey(x.date)===m);return{m,s,j,w,sm:s.length>=3?median(s.map(x=>x.amt)):null,jm:j.length>=3?median(j.map(x=>x.dep)):null}})}
function nearby(a,c){if(!SM?.lat||!SM?.lng)return[];return S.complexes.filter(x=>x.id!==SM.id&&x.lat&&x.lng&&D[x.id]?.areas).map(x=>{const ba=[...D[x.id].areas].sort((u,v)=>Math.abs(u.m2-a.m2)-Math.abs(v.m2-a.m2))[0];if(!ba)return null;const cc=core(ba),dist=distM(SM.lat,SM.lng,x.lat,x.lng);return{x,ba,cc,dist}}).filter(r=>r&&r.dist<=1500&&Math.abs(r.ba.m2-a.m2)<=25&&r.cc.saleMed!=null).sort((p,q)=>p.dist-q.dist).slice(0,4)}
function render(){const a=APT.areas.find(x=>x.m2===band)||APT.areas[0],c=core(a);let h='<div class="answer"><div class="k">지금 핵심</div><div class="v">'+insight(a,c)+'</div></div>';
h+='<div class="bands">'+APT.areas.map(x=>'<button class="'+(x.m2===a.m2?'on':'')+'" onclick="setBand('+x.m2+')">전용 '+x.m2+'㎡</button>').join('')+'</div>';
h+='<div class="cards"><div class="card"><div class="k">매매 대표가격</div><div class="v">'+(c.saleMed!=null?eok(c.saleMed):'표본 부족')+'</div><div class="s">6개월 '+c.sale.length+'건</div></div><div class="card"><div class="k">최근 매매</div><div class="v">'+(c.lastSale?eok(c.lastSale.amt):'-')+'</div><div class="s">'+(c.lastSale?c.lastSale.date+' · '+(c.lastSale.fl||'-')+'층':'최근 6개월 없음')+'</div></div><div class="card"><div class="k">전세 대표가격</div><div class="v">'+(c.jeMed!=null?eok(c.jeMed):'표본 부족')+'</div><div class="s">6개월 '+c.je.length+'건</div></div><div class="card"><div class="k">전세가율</div><div class="v">'+(c.ratio!=null?c.ratio+'%':'-')+'</div><div class="s">같은 면적·같은 기간</div></div></div>';
h+='<div class="tabs"><button class="'+(tab==='summary'?'on':'')+'" onclick="setTab(\'summary\')">거래 요약</button><button class="'+(tab==='trend'?'on':'')+'" onclick="setTab(\'trend\')">6개월 흐름</button><button class="'+(tab==='compare'?'on':'')+'" onclick="setTab(\'compare\')">주변 비교</button></div><div class="panel">'+panel(a,c)+'</div>';$('#app').className='';$('#app').innerHTML=h}
function panel(a,c){if(tab==='summary'){let extra='';if(c.sale.length<3||c.je.length<3)extra='<div class="warn">거래가 3건 미만인 유형은 대표가격을 표시하지 않습니다. 최근 실제 거래를 함께 확인하세요.</div>';return '<h2>'+a.m2+'㎡ 최근 6개월 거래</h2><div class="mix"><div class="it"><b>'+c.sale.length+'</b><span>매매</span></div><div class="it"><b>'+c.je.length+'</b><span>전세</span></div><div class="it"><b>'+c.wo.length+'</b><span>월세</span></div></div><div class="insight">'+recentText(c)+'</div>'+extra+'<div class="note">대표가격은 같은 전용면적의 최근 6개월 실거래 중간값입니다. 층·동·수리 상태에 따라 실제 가격은 달라질 수 있습니다.</div>'}
if(tab==='trend'){const rows=monthly(a,c);return '<h2>'+a.m2+'㎡ 월별 흐름</h2><table class="trend"><thead><tr><th>월</th><th>매매</th><th>매매 대표</th><th>전세</th><th>전세 대표</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r.m.slice(0,4)+'.'+r.m.slice(4)+'</td><td>'+r.s.length+'건</td><td>'+(r.sm!=null?eok(r.sm):'-')+'</td><td>'+r.j.length+'건</td><td>'+(r.jm!=null?eok(r.jm):'-')+'</td></tr>').join('')+'</tbody></table><div class="note">월별 1~2건은 실제 거래 건수만 표시하고 대표가격은 비웁니다.</div>'}
const list=nearby(a,c);return '<h2>반경 1.5km 주변 단지</h2><div class="compare">'+(list.length?list.map(r=>'<a class="cmp" href="./?id='+encodeURIComponent(r.x.id)+'" aria-label="'+r.x.nm+' 단지 상세 거래 보기"><div><div class="nm">'+r.x.nm+'</div><div class="sub">약 '+Math.round(r.dist)+'m · 전용 '+r.ba.m2+'㎡ · '+(r.x.yr||'-')+'년</div><span class="go">이 단지 상세보기 ›</span></div><div class="amt">'+eok(r.cc.saleMed)+'<small>6개월 매매 대표</small></div></a>').join(''):'<div class="note">현재 조건에서 비교할 주변 단지가 충분하지 않습니다.</div>')+'</div><div class="note">거리·면적이 가까운 단지를 우선 보여줍니다. 단지 규모·연식·입지는 별도로 확인하세요.</div>'}
function recentText(c){const parts=[];if(c.lastSale)parts.push('최근 매매 '+eok(c.lastSale.amt)+' ('+c.lastSale.date+')');if(c.lastJe)parts.push('최근 전세 '+eok(c.lastJe.dep)+' ('+c.lastJe.date+')');if(c.lastWo)parts.push('최근 월세 '+eok(c.lastWo.dep)+' / '+c.lastWo.rent+'만 ('+c.lastWo.date+')');return parts.length?parts.join('<br>'):'최근 6개월 신고된 거래가 없습니다.'}
function setBand(m2){band=m2;render()}function setTab(t){tab=t;render()}
Promise.all([fetch(SUM,{cache:'no-cache'}).then(r=>r.json()),fetch(DET,{cache:'no-cache'}).then(r=>r.json())]).then(([s,d])=>{S=s;D=d;if(!id||!D[id])throw new Error('missing');APT=D[id];SM=S.complexes.find(x=>x.id===id)||{};band=APT.areas?.[0]?.m2;if(!band)throw new Error('no areas');document.title=APT.nm+' 단지 상세 거래 | Rent Check';$('#title').textContent=APT.nm+' 단지 상세 거래';$('#meta').textContent=APT.dong+' · '+(APT.yr?APT.yr+'년 준공':'준공연도 미상')+(SM.un?' · '+Number(SM.un).toLocaleString()+'세대':'');$('#updated').textContent='국토부 실거래 신고자료 · '+(S.meta?.updated?String(S.meta.updated).slice(0,4)+'.'+String(S.meta.updated).slice(4,6)+' 기준':'매일 갱신');$('#rawLink').href='../../tools/apartment/?id='+encodeURIComponent(id);$('#backLink').href='../../tools/apartment/?id='+encodeURIComponent(id);render();try{gtag('event','apt_detail_open',{apt:APT.nm,dong:APT.dong})}catch(e){}}).catch(()=>{$('#app').className='loading';$('#app').textContent='단지 상세 정보를 찾지 못했습니다. 아파트 실거래 화면에서 다시 선택해 주세요.'});
</script>
