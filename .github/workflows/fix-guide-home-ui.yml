name: Tighten guide entry layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-guide-home-ui.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten changed UI only
        shell: python
        run: |
          from pathlib import Path

          p=Path('app.js')
          t=p.read_text(encoding='utf-8')
          t=t.replace("['실전 가이드','계약·청년·재개발 답변','/blog/',null]", "['실전 가이드','계약·청년·재개발','/blog/',null]")
          p.write_text(t,encoding='utf-8')

          p=Path('mobile-fix.css')
          t=p.read_text(encoding='utf-8')
          marker='/* Keep home CTA labels on one line. */'
          if marker not in t:
              t += '\n\n'+marker+'\n.cta-actions a{white-space:nowrap}\n'
          p.write_text(t,encoding='utf-8')

      - name: Commit tweak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js mobile-fix.css
          git diff --cached --quiet || git commit -m "Tighten guide entry layout"
          git push
