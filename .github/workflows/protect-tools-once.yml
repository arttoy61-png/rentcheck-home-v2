name: Protect public calculator source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protect-tools-once.yml'

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Obfuscate selected client logic
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          def protected_js(source: str) -> str:
              payload = base64.b64encode(source.encode('utf-8')).decode('ascii')
              return "/* Rent Check protected build · 무단 복제·재배포 금지 */(()=>{const b=atob('" + payload + "'),u=Uint8Array.from(b,c=>c.charCodeAt(0));(0,eval)(new TextDecoder().decode(u))})();"

          def protect_inline(path_str: str, marker: str):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if 'Rent Check protected build' in text and marker not in text:
                  print(path_str, 'already protected')
                  return
              matches = list(re.finditer(r'<script>(.*?)</script>', text, flags=re.S))
              target = None
              for m in matches:
                  if marker in m.group(1):
                      target = m
                      break
              if target is None:
                  raise SystemExit(f'marker not found in {path_str}: {marker}')
              wrapped = '<script>' + protected_js(target.group(1)) + '</script>'
              text = text[:target.start()] + wrapped + text[target.end():]
              path.write_text(text, encoding='utf-8')
              print('protected inline:', path_str)

          protect_inline('tools/youth-score/index.html', 'var rank=null, pay=null, picks={};')
          protect_inline('tools/rent-check/index.html', 'let DATA=null;')

          nearby = Path('tools/rent-check/nearby.js')
          nearby_text = nearby.read_text(encoding='utf-8')
          if 'Rent Check protected build' not in nearby_text:
              nearby.write_text(protected_js(nearby_text), encoding='utf-8')
              print('protected:', nearby)

          notice = Path('PROPRIETARY_NOTICE.txt')
          notice.write_text(
              'Rent Check proprietary notice\n\n'
              'Copyright (c) 2026 Rent Check. All rights reserved.\n'
              'The public website may be viewed and used through rent-check.kr.\n'
              'Copying, republishing, reselling, or redistributing the calculator code, logic, or compiled/obfuscated builds is not permitted without written permission.\n',
              encoding='utf-8'
          )

          # One-time workflow: remove itself after the protected build is created.
          Path('.github/workflows/protect-tools-once.yml').unlink(missing_ok=True)

      - name: Commit protected build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/youth-score/index.html tools/rent-check/index.html tools/rent-check/nearby.js PROPRIETARY_NOTICE.txt .github/workflows/protect-tools-once.yml
          git diff --cached --quiet || git commit -m "Protect public calculator builds"
          git push
