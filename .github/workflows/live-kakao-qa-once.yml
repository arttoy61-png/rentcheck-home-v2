name: Live Kakao QA once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-kakao-qa-once.yml"
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for rebuilt source geo data
        run: |
          node <<'JS'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(u){const r=await fetch(u+'?t='+Date.now(),{headers:{'cache-control':'no-cache'}});if(!r.ok)throw new Error(String(r.status));return r.json()}
          for(let i=0;i<60;i++){
            try{
              const [a,s]=await Promise.all([
                get('https://raw.githubusercontent.com/arttoy61-png/rent-check/main/auction_data.json'),
                get('https://raw.githubusercontent.com/arttoy61-png/rent-check/main/gangseo_apt_summary.json')
              ]);
              const rentals=[...(a.jeonse||[]),...(a.wolse||[])];
              const rentalJ=rentals.filter(x=>x.j).length;
              const apt=(s.complexes||[]).filter(x=>x.lat&&x.lng).length;
              console.log(`attempt ${i+1}: rentalJ=${rentalJ}, aptGeo=${apt}`);
              if(rentalJ>1000 && apt>600) process.exit(0);
            }catch(e){console.log('waiting:',e.message)}
            await sleep(15000);
          }
          throw new Error('rebuilt geo data did not become ready');
          JS
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Click-test live rent and apartment tools
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844}});
            const report={rent:{},apartments:[]};
            const page=await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});

            await page.goto('https://rent-check.kr/tools/rent-check/?qa='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.locator('#nearbyAddress').fill('서울 강서구 화곡로 지하 168');
            await page.locator('#nearbyAddressBtn').click();
            await page.waitForFunction(()=>document.querySelector('#nearbyAddressStatus')?.textContent?.includes('확인됨'),null,{timeout:30000});
            await page.locator('#area').fill('30');
            await page.locator('#deposit').fill('1000');
            await page.locator('#rent').fill('60');
            await page.locator('#checkBtn').click();
            await page.waitForSelector('#nearbyResult',{state:'visible',timeout:30000});
            const rentText=await page.locator('#nearbyResult').innerText();
            const match=rentText.match(/거래\s+(\d+)건\s+중/);
            const count=match?Number(match[1]):-1;
            const mapChildren=await page.locator('#nearbyMap').evaluate(el=>el.children.length);
            report.rent={address:'서울 강서구 화곡로 지하 168',area:30,deposit:1000,rent:60,count,mapChildren,text:rentText.slice(0,1000)};
            if(count<=0) throw new Error('live rent comparison still returns zero matches');
            if(mapChildren<=0) throw new Error('live rent Kakao map did not render');

            const tests=['강서힐스테이트','화곡푸르지오','등촌동아이파크','마곡엠밸리9단지','방화5'];
            for(const name of tests){
              const p=await ctx.newPage();
              const localErrors=[];
              p.on('pageerror',e=>localErrors.push('pageerror:'+e.message));
              p.on('console',m=>{if(m.type()==='error') localErrors.push('console:'+m.text())});
              await p.goto('https://rent-check.kr/tools/apartment/?qa='+Date.now(),{waitUntil:'networkidle',timeout:60000});
              await p.locator('#q').fill(name);
              await p.waitForSelector('#sres:not(.hide) .it',{timeout:20000});
              await p.locator('#sres .it').first().click();
              await p.waitForSelector('#map',{state:'visible',timeout:30000});
              await p.waitForFunction(()=>document.querySelector('#map')?.children?.length>0,null,{timeout:30000});
              const title=await p.locator('.det h2').innerText();
              const childCount=await p.locator('#map').evaluate(el=>el.children.length);
              report.apartments.push({query:name,title,mapChildren:childCount,errors:localErrors.slice(0,5)});
              if(childCount<=0) throw new Error(`${name}: Kakao map not rendered`);
              await p.close();
            }
            report.consoleErrors=errors.slice(0,10);
            report.ok=true;
            report.checkedAt=new Date().toISOString();
            fs.writeFileSync('data/live-kakao-qa.json',JSON.stringify(report,null,2)+'\n');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit QA report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-kakao-qa.json
          git commit -m "test: live click QA Kakao tools"
          git pull --rebase --autostash || true
          git push
