name: Readiness repair and browser evidence
on:
  push:
    branches: [main, fix/adsense-readiness-20260925]
    paths:
      - scripts/readiness_20260925.py
      - .github/workflows/readiness-20260925.yml
  workflow_dispatch:
    inputs:
      apply_repairs:
        description: Apply only on the dedicated repair branch; false is read-only
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: readiness-20260925-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      READINESS_OUT: /tmp/rentcheck-readiness
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Capture baseline browser state
        if: github.ref_name == 'fix/adsense-readiness-20260925' && (github.event_name == 'push' || inputs.apply_repairs)
        run: python scripts/readiness_20260925.py --browser before
      - name: Apply narrowly scoped repairs
        if: github.ref_name == 'fix/adsense-readiness-20260925' && (github.event_name == 'push' || inputs.apply_repairs)
        run: python scripts/readiness_20260925.py --apply
      - name: Verify source and generated links
        run: python scripts/readiness_20260925.py --verify
      - name: Compare repaired browser state
        if: github.ref_name == 'fix/adsense-readiness-20260925' && (github.event_name == 'push' || inputs.apply_repairs)
        run: python scripts/readiness_20260925.py --browser after
      - name: Inventory all HTML without editing content
        if: always()
        run: python scripts/readiness_20260925.py --inventory
      - name: Wait for repaired public assets
        if: github.ref_name == 'main'
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(12):
              try:
                  url='https://rent-check.kr/app.js?v=readiness-20260925&verify='+str(int(time.time()))
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      source=r.read().decode('utf-8')
                  if "function resolveToolLinks(){$$('[data-tool-link]').forEach(" in source:
                      print('PUBLIC_REPAIRED_ASSET=CONFIRMED')
                      break
              except Exception as exc:
                  print(type(exc).__name__,str(exc)[:160])
              time.sleep(10)
          else:
              raise SystemExit('Public revision not observed; do not claim live verification')
          PY
      - name: Observe public site without assuming branch deployment
        if: always()
        run: python scripts/readiness_20260925.py --browser live
      - name: Assert deployed repairs on main
        if: github.ref_name == 'main'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['READINESS_OUT'])/'live.json').read_text())
          assert len(rows)==16
          for row in rows:
              assert row.get('status')==200 and not row.get('error'),row
              assert not row.get('errors') and not row.get('overflow'),row
              if row['route']=='/':assert row['post_label']=='네이버 발행 글',row
              if '/notices/lh-' in row['route']:assert row['editorial_link']==1,row
              if row['route']=='/tools/youth-score/':assert row['calculated_score']=='5점',row
          print('PUBLIC_BROWSER_VERIFIED=PASS (16 observations, 12 paths; no errors; four guide links; sample score preserved)')
          PY
      - name: Commit only tested repairs to the isolated branch
        if: success() && github.ref_name == 'fix/adsense-readiness-20260925' && (github.event_name == 'push' || inputs.apply_repairs)
        run: |
          git diff --check
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths=json.loads((Path(os.environ['READINESS_OUT'])/'changed-files.json').read_text())
          allowed={'app.js','index.html','scripts/render-core-content.mjs','scripts/generate-public-housing-pages.py'}
          allowed.update('public-housing/notices/lh-'+x+'/index.html' for x in ['2015122300020753','2015122300020759','2015122300020750','2015122300020749'])
          assert set(paths) <= allowed
          if paths:subprocess.run(['git','add','--',*paths],check=True)
          PY
          if ! git diff --cached --quiet; then
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git commit -m 'fix: repair home initialization and connect existing editorial guides'
            git push origin HEAD:fix/adsense-readiness-20260925
          fi
      - name: Preserve source snapshot for page-by-page editorial audit
        if: always()
        run: |
          mkdir -p /tmp/rentcheck-readiness
          git rev-parse HEAD > /tmp/rentcheck-readiness/source-sha.txt
          git archive --format=zip --output=/tmp/rentcheck-readiness/source-snapshot.zip HEAD
      - name: Upload evidence and original files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-evidence-${{ github.run_id }}
          path: /tmp/rentcheck-readiness
          retention-days: 7
          if-no-files-found: warn
