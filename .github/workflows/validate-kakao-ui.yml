name: Validate Kakao UI once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-kakao-ui.yml"
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check tools/rent-check/nearby.js
          node --check tools/apartment/kakao-map.js
          node --check tools/tool-common.js
      - name: Static integration checks
        run: |
          grep -q 'nearby.js' tools/rent-check/index.html
          grep -q 'kakao-map.js' tools/apartment/index.html
          grep -q 'KAKAO_JS_KEY' tools/rent-check/nearby.js
          grep -q '반경 500m' tools/rent-check/nearby.js
          grep -q '__rentcheckKakaoMiniMap' tools/apartment/index.html
          ! grep -qi 'openstreetmap\|leaflet' tools/apartment/index.html
          grep -q '주소 주변 실거래로 내 계약 조건을 비교합니다.' tools/tool-common.js
      - name: Validate expected flow
        run: |
          python - <<'PY'
          from pathlib import Path
          nearby=Path('tools/rent-check/nearby.js').read_text(encoding='utf-8')
          assert "e.stopImmediatePropagation()" in nearby
          assert "auction_data.json" in nearby
          assert "distance>500" in nearby
          assert "주소 기준 자동" in nearby
          assert "Rent Check에 저장하지 않습니다" in nearby
          apt=Path('tools/apartment/index.html').read_text(encoding='utf-8').lower()
          assert 'openstreetmap' not in apt and 'leaflet' not in apt
          print('Kakao UI validation OK')
          PY
      - name: Write success marker
        run: |
          mkdir -p data
          printf 'Kakao UI validation OK\n' > data/kakao-ui-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kakao-ui-validation.txt
          git commit -m "test: validate Kakao rent and apartment UI"
          git pull --rebase --autostash || true
          git push
