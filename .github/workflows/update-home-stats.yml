name: Update V2 home stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'content/static-first-*'
    paths:
      - '.github/workflows/update-home-stats.yml'
      - 'scripts/make_home_stats.py'
      - 'scripts/wait_public_collection.py'
      - 'scripts/test_wait_public_collection.py'
      - 'scripts/render-core-content.mjs'
      - 'scripts/analysis-snapshot-runtime.js'
      - 'scripts/test_static_first.py'
      - 'data/posts*.json'
      - 'data/posts-loader.js'
      - 'tools/tool-common.js'
  pull_request:
    paths:
      - '.github/workflows/update-home-stats.yml'
      - 'scripts/wait_public_collection.py'
      - 'scripts/test_wait_public_collection.py'
      - 'scripts/render-core-content.mjs'
      - 'scripts/analysis-snapshot-runtime.js'
      - 'scripts/test_static_first.py'
  schedule:
    - cron: '0 21 * * *'  # 매일 06:00 KST - 05:15 수집 이후
    - cron: '45 22 * * *' # 매일 07:45 KST - 07:15 보조 재수집 이후
    - cron: '0 7 * * *'   # 매일 16:00 KST - 오후 실거래 수집 이후

permissions:
  contents: read

concurrency:
  group: rentcheck-home-v2-home-stats-${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p 'test_wait_public_collection.py' -v
      - name: Check static renderer syntax
        run: |
          node --check scripts/render-core-content.mjs
          node --check scripts/analysis-snapshot-runtime.js
          python -m py_compile scripts/test_static_first.py
  update:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-render existing home lists and calculator guide
        run: node scripts/render-core-content.mjs --content-only

      - name: Wait for completed public collection and pin snapshot
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/wait_public_collection.py

      - name: Download current source data
        if: steps.source.outputs.ready == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          mkdir -p .cache-home-stats
          for NAME in molit_kangseo.csv gangseo_apt_detail.json gangseo_apt_summary.json; do
            curl -fL --retry 3 --retry-delay 2 \
              -H 'Cache-Control: no-cache' \
              -o ".cache-home-stats/${NAME}" \
              "https://raw.githubusercontent.com/arttoy61-png/rent-check/${SOURCE_SHA}/${NAME}"
          done

      - name: Build home_stats
        if: steps.source.outputs.ready == 'true'
        run: python scripts/make_home_stats.py

      - name: Pre-render the validated apartment analysis snapshot
        if: steps.source.outputs.ready == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: node scripts/render-core-content.mjs

      - name: Validate home_stats
        if: steps.source.outputs.ready == 'true'
        run: |
          python -m json.tool data/home_stats.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/home_stats.json').read_text(encoding='utf-8'))
          assert p.get('schema_version') == 2
          assert p.get('data_until')
          assert isinstance(p.get('recent_deals'), list)
          assert len(p['recent_deals']) <= 3
          assert isinstance(p.get('monthly_trend'), list) and len(p['monthly_trend']) == 6
          print('home_stats validation OK')
          print('latest contract:', p['data_until'])
          for d in p['recent_deals']:
              print(d.get('date'), d.get('dong'), d.get('name'), d.get('amount_eok'))
          PY

      - name: Browser regression before publishing a preview branch
        if: github.ref_name != 'main'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_READY: ${{ steps.source.outputs.ready }}
        run: |
          test "$SOURCE_READY" = true
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/test_static_first.py

      - name: Point V2 homepage at local stats
        if: steps.source.outputs.ready == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = 'https://arttoy61-png.github.io/rent-check/home_stats.json'
          new = './data/home_stats.json'
          if old in text:
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('home_stats fetch URL not found in app.js')
          PY

      - name: Commit generated homepage data and static content
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add data/home_stats.json app.js index.html \
            data/posts-loader.js data/home-analysis-ui.js \
            tools/jeonse-ratio/index.html analysis/ujangsan-hillstate/index.html
          git diff --cached --quiet || git commit -m 'build: refresh home stats and initial HTML snapshots'
          git pull --rebase --autostash
          git push
