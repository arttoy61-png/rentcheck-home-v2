name: Fix nearby rent fallback once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-nearby-rent-once.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch nearby rent logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('tools/rent-check/nearby.js')
          s=p.read_text(encoding='utf-8')

          pattern=r"    const maxMonth=monthIndex\(data\.updated\), tol=Math\.max\(8,area\*\.20\);\n\n    const collect=months=>.*?    return \{rows:rows\.slice\(0,5\),total:rows\.length,period,typeInfo:inferred\};"
          replacement="""    const maxMonth=monthIndex(data.updated);
    const collect=(months,radius,tolRatio)=>{
      const tol=Math.max(8,area*tolRatio);
      return source.filter(r=>!inferred.code||r.t===inferred.code)
        .filter(r=>Math.abs(num(r.a)-area)<=tol)
        .filter(r=>{const m=monthIndex(r.ym);return maxMonth<0||m<0||m>=maxMonth-months+1;})
        .map(r=>{
          const xy=coords(data,r);if(!xy)return null;
          const distance=haversine(state.location.lat,state.location.lng,xy.lat,xy.lng);
          if(distance>radius)return null;
          return {...r,...xy,distance,areaDiff:Math.abs(num(r.a)-area),same:Boolean(state.location.jibunKey&&`${r.u} ${r.j}`===state.location.jibunKey)};
        }).filter(Boolean);
    };

    let period=12,radius=500,tolRatio=.20,rows=collect(12,500,.20);
    if(rows.length<3){period=24;rows=collect(24,500,.20);}
    if(rows.length<3){radius=800;tolRatio=.25;rows=collect(24,800,.25);}
    rows.sort((a,b)=>Number(b.same)-Number(a.same)||a.distance-b.distance||a.areaDiff-b.areaDiff||String(b.ym+String(b.d).padStart(2,'0')).localeCompare(String(a.ym+String(a.d).padStart(2,'0'))));
    return {rows:rows.slice(0,5),total:rows.length,period,radius,tolRatio,typeInfo:inferred};"""

          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'comparable block replacement count={n}')
          s=s2

          replacements={
            "function verdict(rows,kind){":"function verdict(rows,kind,radius){",
            "sub:`주변 500m 안에서 조건이 비슷한 ${kind} 실거래가 ${rows.length}건입니다.`":"sub:`주변 ${radius}m 안에서 조건이 비슷한 ${kind} 실거래가 ${rows.length}건입니다.`",
            "const kind=dealKind(),v=verdict(info.rows,kind),box=resultBox();":"const kind=dealKind(),v=verdict(info.rows,kind,info.radius),box=resultBox();",
            "반경 500m · ${esc(info.typeInfo.label)}":"반경 ${info.radius}m · ${esc(info.typeInfo.label)}",
            "500m 안에서 조건이 비슷한 거래 ${info.total}건":"${info.radius}m 안에서 조건이 비슷한 거래 ${info.total}건",
            "주소를 넣으면 주변 500m의 비슷한 실거래만 비교합니다.":"주소를 넣으면 주변 500~800m에서 비슷한 실거래를 자동으로 찾습니다."
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('missing replacement target: '+old[:80])
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          print('nearby.js patched')
          PY
      - name: Syntax check
        run: node --check tools/rent-check/nearby.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/rent-check/nearby.js
          git commit -m "Fix nearby monthly-rent fallback radius" || exit 0
          git pull --rebase --autostash || true
          git push
