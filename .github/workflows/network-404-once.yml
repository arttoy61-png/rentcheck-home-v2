name: Trace rent-check 404 once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/network-404-once.yml"
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Trace responses
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844}});
            const page=await ctx.newPage();
            const bad=[];
            page.on('response',r=>{if(r.status()>=400)bad.push({status:r.status(),url:r.url(),type:r.request().resourceType()})});
            await page.goto('https://rent-check.kr/tools/rent-check/?trace='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.locator('#nearbyAddress').fill('서울 강서구 화곡로 지하 168');
            await page.locator('#nearbyAddressBtn').click();
            await page.waitForFunction(()=>document.querySelector('#nearbyAddressStatus')?.textContent?.includes('확인됨'),null,{timeout:30000});
            await page.locator('#area').fill('30');
            await page.locator('#deposit').fill('1000');
            await page.locator('#rent').fill('60');
            await page.locator('#checkBtn').click();
            await page.waitForSelector('#nearbyResult',{state:'visible',timeout:30000});
            await page.waitForTimeout(1500);
            fs.mkdirSync('data',{recursive:true});
            fs.writeFileSync('data/network-404.json',JSON.stringify({checkedAt:new Date().toISOString(),bad},null,2)+'\n');
            console.log(JSON.stringify(bad,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/network-404.json
          git commit -m "test: trace rent-check network errors" || exit 0
          git pull --rebase --autostash || true
          git push
