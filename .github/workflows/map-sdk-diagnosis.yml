name: HOME map SDK response diagnosis
on:
  push:
    branches: ['migrate/redevelopment-home-20261019']
    paths: ['.github/workflows/map-sdk-diagnosis.yml']
permissions:
  contents: read
jobs:
  read-only-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Read HTTP error only; no geocoding, key rotation or domain changes
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,re,urllib.request,urllib.error
          from pathlib import Path
          report={'purpose':'read-only HTTP error diagnosis','browser_ORB_protection':'unchanged','new_geocoding_requests':0,'analytics':'not_loaded'}
          config=urllib.request.urlopen('https://rent-check.kr/redevelopment/config.public.js',timeout=20).read().decode()
          key=re.search(r'kakaoJavaScriptKey\s*:\s*"([a-f0-9]{32})"',config).group(1)
          url='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+key+'&autoload=false&libraries=services'
          req=urllib.request.Request(url,headers={'Referer':'https://rent-check.kr/','User-Agent':'RentCheck-Migration-Diagnostic/1'})
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  report.update(status=r.status,content_type=r.headers.get('Content-Type'),body_kind='javascript' if 'javascript' in r.headers.get('Content-Type','') else 'other')
          except urllib.error.HTTPError as e:
              body=e.read(4096).decode('utf8','replace').replace(key,'[redacted]')
              report.update(status=e.code,content_type=e.headers.get('Content-Type'),error_body=re.sub(r'\b[a-fA-F0-9]{32,64}\b','[redacted]',body))
          except Exception as e:report['transport_error']=type(e).__name__
          report['existing_public_key_used']=True
          Path('evidence/result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-map-sdk-http-diagnosis
          path: evidence/
          retention-days: 3
