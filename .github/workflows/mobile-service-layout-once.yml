name: Improve mobile five-tool layout once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-service-layout-once.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile service grid
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-fix.css')
          s=p.read_text(encoding='utf-8')
          start=s.index('/* Service strip: 3 + 2 grid on mobile, no horizontal scroll. */')
          end=s.index('\n\n/* Keep home CTA labels on one line. */', start)
          new='''/* Service strip: balanced 2 + 2 + 1 grid on mobile, no horizontal scroll. */
@media (max-width: 768px){
  .service-strip{
    overflow:visible!important;
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:1px!important;
    padding:1px!important;
    background:#e7eaee;
    border-radius:14px;
    scroll-padding-right:0!important;
    scroll-snap-type:none!important;
  }
  .service-item{
    min-width:0!important;
    height:86px;
    padding:12px 13px;
    grid-template-columns:36px minmax(0,1fr);
    gap:10px;
    background:#fff;
    border:0!important;
    scroll-snap-align:none;
  }
  .service-item:nth-child(1){border-radius:13px 0 0 0!important}
  .service-item:nth-child(2){border-radius:0 13px 0 0!important}
  .service-item:nth-child(5){
    grid-column:1 / -1!important;
    height:78px;
    border-radius:0 0 13px 13px!important;
    grid-template-columns:36px auto;
    justify-content:center;
  }
  .service-icon{width:36px;height:36px}
  .service-copy strong{font-size:14px;line-height:1.3}
  .service-copy small{font-size:12px;line-height:1.35;white-space:normal}
}
@media (max-width: 430px){
  .service-item{height:84px;padding:11px 10px;grid-template-columns:32px minmax(0,1fr);gap:8px}
  .service-item:nth-child(5){height:74px;grid-template-columns:32px auto}
  .service-icon{width:32px;height:32px;border-radius:8px}
  .service-icon svg{width:17px;height:17px}
  .service-copy strong{font-size:13px}
  .service-copy small{font-size:11px}
}
'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8')
          PY
      - name: Verify mobile CSS
        run: |
          grep -q 'balanced 2 + 2 + 1 grid' mobile-fix.css
          grep -q 'grid-column:1 / -1' mobile-fix.css
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile-fix.css
          git commit -m "Polish mobile five-tool layout"
          git pull --rebase --autostash || true
          git push
