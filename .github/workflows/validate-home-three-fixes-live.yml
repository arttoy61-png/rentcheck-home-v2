name: HOME three-fix live production validation
on:
  push:
    branches:
      - content/static-first-home-three-fixes-20261010
    paths:
      - '.github/workflows/validate-home-three-fixes-live.yml'
      - 'scripts/validate_home_three_fixes_live.py'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate deployed rent-check.kr at mobile and PC widths
        run: python scripts/validate_home_three_fixes_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-three-fix-live-${{ github.run_id }}
          path: test-artifacts/home-three-fixes-live/
          retention-days: 7
          if-no-files-found: warn
