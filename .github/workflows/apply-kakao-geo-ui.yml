name: Apply Kakao geo UI
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-kakao-geo-ui.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tool pages safely
        run: |
          python - <<'PY'
          from pathlib import Path

          def add_script(path, src):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              tag = f'<script src="{src}"></script>'
              if tag not in text:
                  if '</body>' not in text:
                      raise SystemExit(f'</body> missing: {path}')
                  text = text.replace('</body>', tag + '</body>', 1)
                  p.write_text(text, encoding='utf-8')

          add_script('tools/rent-check/index.html', 'nearby.js')
          add_script('tools/apartment/index.html', 'kakao-map.js')

          common = Path('tools/tool-common.js')
          text = common.read_text(encoding='utf-8')
          old = "강서구 화곡동 실거래 기준으로 내 계약 조건을 비교합니다."
          new = "주소 주변 실거래로 내 계약 조건을 비교합니다."
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('rent-check hero copy not found')
          common.write_text(text, encoding='utf-8')
          PY
      - name: Validate inserted scripts
        run: |
          grep -q 'nearby.js' tools/rent-check/index.html
          grep -q 'kakao-map.js' tools/apartment/index.html
          grep -q '주소 주변 실거래로 내 계약 조건을 비교합니다.' tools/tool-common.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/rent-check/index.html tools/apartment/index.html tools/tool-common.js
          git diff --cached --quiet || git commit -m "Connect Kakao address and apartment map UI"
          git pull --rebase --autostash || true
          git push
