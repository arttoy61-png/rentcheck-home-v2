<svg xmlns="http://www.w3.org/2000/svg" width="760" height="630" viewBox="0 0 760 630" role="img" aria-labelledby="title desc"><title id="title">가격보다 비교 조건을 먼저 맞춥니다</title><desc id="desc">Rent Check 실거래 비교표 만드는 순서</desc><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="760" height="630" rx="0" fill="#ffffff"/><rect x="0" y="0" width="760" height="8" rx="0" fill="#7a3fb0"/><text x="32" y="45" font-size="20" fill="#536174">Rent Check · 실거래로 더 정확하게</text><text x="32" y="100" font-size="36" fill="#0d1f3c" font-weight="700">가격보다 비교 조건을 먼저 맞춥니다</text><text x="32" y="141" font-size="25" fill="#536174">Rent Check 실거래 비교표 만드는 순서</text><rect x="32" y="176" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="213" r="22" fill="#7a3fb0"/><text x="69" y="222" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="108" y="222" font-size="32" fill="#0d1f3c" font-weight="700">거래 종류부터 나누기</text><text x="108" y="261" font-size="28" fill="#536174">매매 / 전세 / 월세를 섞지 않기</text><rect x="32" y="305" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="342" r="22" fill="#7a3fb0"/><text x="69" y="351" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="108" y="351" font-size="32" fill="#0d1f3c" font-weight="700">같은 단지 · 같은 전용면적</text><text x="108" y="390" font-size="28" fill="#536174">조회 범위를 넓혔다면 따로 기록</text><rect x="32" y="434" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="471" r="22" fill="#7a3fb0"/><text x="69" y="480" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="108" y="480" font-size="32" fill="#0d1f3c" font-weight="700">계약기간과 건수를 남기기</text><text x="108" y="519" font-size="28" fill="#536174">층 · 해제 표시 · 신규/갱신도 확인</text><path d="M32 585 H728" stroke="#d7dce3"/><text x="32" y="612" font-size="20" fill="#536174">자료 기준과 예외는 본문·그림 아래 출처에서 확인하세요.</text></g></svg>