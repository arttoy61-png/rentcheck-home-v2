<svg xmlns="http://www.w3.org/2000/svg" width="760" height="670" viewBox="0 0 760 670" role="img" aria-labelledby="title desc"><title id="title">같은 면적, 두 금액을 비교해보면</title><desc id="desc">8월 6일 15억원 / 8월 8일 16억3,000만원</desc><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="760" height="670" rx="0" fill="#ffffff"/><rect x="0" y="0" width="760" height="8" rx="0" fill="#7a3fb0"/><text x="32" y="45" font-size="20" fill="#536174">Rent Check · 실거래로 더 정확하게</text><text x="32" y="100" font-size="36" fill="#0d1f3c" font-weight="700">같은 면적, 두 금액을 비교해보면</text><text x="32" y="141" font-size="25" fill="#536174">8월 6일 15억원 / 8월 8일 16억3,000만원</text><rect x="32" y="174" width="696" height="90" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><text x="54" y="212" font-size="30" fill="#0d1f3c" font-weight="700">우장산아이파크·이편한세상</text><text x="54" y="249" font-size="25" fill="#536174">동일 전용면적 84.97㎡ · 서로 다른 계약 기록</text><text x="32" y="309" font-size="28" fill="#0d1f3c" font-weight="700">8월 6일</text><rect x="180" y="284" width="414" height="44" rx="4" fill="#0d1f3c"/><text x="610" y="318" font-size="28" fill="#0d1f3c" font-weight="700">15억</text><text x="32" y="382" font-size="28" fill="#0d1f3c" font-weight="700">8월 8일</text><rect x="180" y="357" width="450" height="44" rx="4" fill="#7a3fb0"/><text x="648" y="391" font-size="27" fill="#7a3fb0" font-weight="700">16.3억</text><path d="M180 414 H630" stroke="#536174"/><text x="180" y="449" font-size="22" fill="#536174" text-anchor="middle">0</text><text x="630" y="449" font-size="22" fill="#536174" text-anchor="end">16.3억원</text><rect x="32" y="477" width="696" height="88" rx="12" fill="#f7f2fb" stroke="#d7dce3"/><text x="54" y="530" font-size="37" fill="#7a3fb0" font-weight="700">차이 1억3,000만원</text><text x="442" y="530" font-size="26" fill="#536174">원인은 추가 확인</text><text x="32" y="603" font-size="24" fill="#536174">8월 31일 확인 월결산 수록값 · 최신 재조회값 아님</text><path d="M32 625 H728" stroke="#d7dce3"/><text x="32" y="652" font-size="20" fill="#536174">자료 기준과 예외는 본문·그림 아래 출처에서 확인하세요.</text></g></svg>