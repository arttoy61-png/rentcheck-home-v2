<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc"><title id="title">발급 화면에서 놓치기 쉬운 세 가지</title><desc id="desc">이번 SH 공고 14쪽 기준 · 다른 공고에 일반화 금지</desc><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="760" height="600" rx="0" fill="#ffffff"/><rect x="0" y="0" width="760" height="8" rx="0" fill="#7a3fb0"/><text x="32" y="45" font-size="20" fill="#536174">Rent Check · 실거래로 더 정확하게</text><text x="32" y="100" font-size="36" fill="#0d1f3c" font-weight="700">발급 화면에서 놓치기 쉬운 세 가지</text><text x="32" y="141" font-size="25" fill="#536174">이번 SH 공고 14쪽 기준 · 다른 공고에 일반화 금지</text><rect x="32" y="175" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="212" r="22" fill="#7a3fb0"/><text x="69" y="221" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="108" y="221" font-size="32" fill="#0d1f3c" font-weight="700">발급일</text><text x="108" y="260" font-size="28" fill="#536174">2026.8.28. 모집공고일 이후</text><rect x="32" y="302" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="339" r="22" fill="#7a3fb0"/><text x="69" y="348" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="108" y="348" font-size="32" fill="#0d1f3c" font-weight="700">가족관계증명서</text><text x="108" y="387" font-size="28" fill="#536174">신청자 본인 기준 · 상세</text><rect x="32" y="429" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="466" r="22" fill="#7a3fb0"/><text x="69" y="475" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="108" y="475" font-size="32" fill="#0d1f3c" font-weight="700">개인정보 동의서</text><text x="108" y="514" font-size="28" fill="#536174">무주택세대구성원 전원 동의</text><path d="M32 555 H728" stroke="#d7dce3"/><text x="32" y="582" font-size="20" fill="#536174">자료 기준과 예외는 본문·그림 아래 출처에서 확인하세요.</text></g></svg>