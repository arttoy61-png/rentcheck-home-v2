<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><title id="title">예비 1번이 실제 대기 1번은 아닐 수 있습니다</title><desc id="desc">앞 공고 대기자가 남아 있는 경우를 먼저 확인</desc><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="760" height="560" rx="0" fill="#ffffff"/><rect x="0" y="0" width="760" height="8" rx="0" fill="#7a3fb0"/><text x="32" y="45" font-size="20" fill="#536174">Rent Check · 실거래로 더 정확하게</text><text x="32" y="100" font-size="36" fill="#0d1f3c" font-weight="700">예비 1번이 실제 대기 1번은 아닐 수 있습니다</text><text x="32" y="141" font-size="25" fill="#536174">앞 공고 대기자가 남아 있는 경우를 먼저 확인</text><rect x="32" y="174" width="696" height="110" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><text x="54" y="214" font-size="29" fill="#0d1f3c" font-weight="700">앞 공고 대기자 5명</text><circle cx="408" cy="234" r="20" fill="#0d1f3c"/><text x="408" y="242" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="469" cy="234" r="20" fill="#0d1f3c"/><text x="469" y="242" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="530" cy="234" r="20" fill="#0d1f3c"/><text x="530" y="242" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="591" cy="234" r="20" fill="#0d1f3c"/><text x="591" y="242" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">4</text><circle cx="652" cy="234" r="20" fill="#0d1f3c"/><text x="652" y="242" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">5</text><rect x="32" y="303" width="320" height="130" rx="12" fill="#f7f2fb" stroke="#d7dce3"/><text x="56" y="349" font-size="28" fill="#536174">이번 공고</text><text x="56" y="411" font-size="40" fill="#7a3fb0" font-weight="700">예비 1번</text><text x="380" y="385" font-size="40" fill="#0d1f3c" font-weight="700" text-anchor="middle">→</text><rect x="408" y="303" width="320" height="130" rx="12" fill="#f7f2fb" stroke="#d7dce3"/><text x="432" y="349" font-size="28" fill="#536174">실제 대기순번</text><text x="432" y="398" font-size="34" fill="#7a3fb0" font-weight="700">6번일 수 있음</text><text x="32" y="488" font-size="26" fill="#536174">LH 공식 안내의 예시 · 현재 대기현황이 아닙니다.</text><path d="M32 515 H728" stroke="#d7dce3"/><text x="32" y="542" font-size="20" fill="#536174">자료 기준과 예외는 본문·그림 아래 출처에서 확인하세요.</text></g></svg>