<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580" role="img" aria-labelledby="title desc"><title id="title">거래 한 줄에서 확인할 네 칸</title><desc id="desc">금액만 복사하지 말고 조건도 같이 기록하세요.</desc><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="760" height="580" rx="0" fill="#ffffff"/><rect x="0" y="0" width="760" height="8" rx="0" fill="#7a3fb0"/><text x="32" y="45" font-size="20" fill="#536174">Rent Check · 실거래로 더 정확하게</text><text x="32" y="100" font-size="36" fill="#0d1f3c" font-weight="700">거래 한 줄에서 확인할 네 칸</text><text x="32" y="141" font-size="25" fill="#536174">금액만 복사하지 말고 조건도 같이 기록하세요.</text><rect x="32" y="176" width="696" height="64" rx="8" fill="#0d1f3c"/><text x="56" y="218" font-size="28" fill="#fff" font-weight="700">가상 기록 · 실제 실거래가 아닙니다</text><rect x="32" y="258" width="336" height="113" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><text x="52" y="284" font-size="25" fill="#536174">전용면적</text><text x="52" y="345" font-size="38" fill="#0d1f3c" font-weight="700">84.97㎡</text><text x="198" y="345" font-size="20" fill="#536174">비교할 집의 크기</text><rect x="392" y="258" width="336" height="113" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><text x="412" y="284" font-size="25" fill="#536174">계약일</text><text x="412" y="345" font-size="38" fill="#0d1f3c" font-weight="700">8월 6일</text><text x="558" y="345" font-size="20" fill="#536174">거래가 체결된 시점</text><rect x="32" y="388" width="336" height="113" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><text x="52" y="414" font-size="25" fill="#536174">층</text><text x="52" y="475" font-size="38" fill="#0d1f3c" font-weight="700">12층</text><text x="198" y="475" font-size="20" fill="#536174">공개된 주택조건</text><rect x="392" y="388" width="336" height="113" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><text x="412" y="414" font-size="25" fill="#536174">매매금액</text><text x="412" y="475" font-size="38" fill="#0d1f3c" font-weight="700">15억원</text><text x="558" y="475" font-size="20" fill="#536174">그 계약의 금액</text><path d="M32 535 H728" stroke="#d7dce3"/><text x="32" y="562" font-size="20" fill="#536174">자료 기준과 예외는 본문·그림 아래 출처에서 확인하세요.</text></g></svg>