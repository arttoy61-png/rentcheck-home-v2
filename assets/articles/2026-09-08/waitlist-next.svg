<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">이사 결정은 번호가 아닌 안내를 보고</title><desc id="desc">Rent Check 확인 순서 · 입주일을 보장하는 규정 아님</desc><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="760" height="610" rx="0" fill="#ffffff"/><rect x="0" y="0" width="760" height="8" rx="0" fill="#7a3fb0"/><text x="32" y="45" font-size="20" fill="#536174">Rent Check · 실거래로 더 정확하게</text><text x="32" y="100" font-size="36" fill="#0d1f3c" font-weight="700">이사 결정은 번호가 아닌 안내를 보고</text><text x="32" y="141" font-size="25" fill="#536174">Rent Check 확인 순서 · 입주일을 보장하는 규정 아님</text><rect x="32" y="176" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="213" r="22" fill="#7a3fb0"/><text x="69" y="222" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="108" y="222" font-size="32" fill="#0d1f3c" font-weight="700">예비번호만 받았다면</text><text x="108" y="261" font-size="28" fill="#536174">현 거주 유지 · 실제 대기순번 확인</text><rect x="32" y="302" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="339" r="22" fill="#7a3fb0"/><text x="69" y="348" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="108" y="348" font-size="32" fill="#0d1f3c" font-weight="700">계약 연락을 받았다면</text><text x="108" y="387" font-size="28" fill="#536174">대상 주택 · 계약기한 · 납부일 확인</text><rect x="32" y="428" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="465" r="22" fill="#7a3fb0"/><text x="69" y="474" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="108" y="474" font-size="32" fill="#0d1f3c" font-weight="700">입주 일정이 정해졌다면</text><text x="108" y="513" font-size="28" fill="#536174">현재 집 보증금 반환 · 이사일 조율</text><path d="M32 565 H728" stroke="#d7dce3"/><text x="32" y="592" font-size="20" fill="#536174">자료 기준과 예외는 본문·그림 아래 출처에서 확인하세요.</text></g></svg>