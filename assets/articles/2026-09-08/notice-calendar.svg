<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc"><title id="title">달력에는 날짜 + 행동 + 시간을</title><desc id="desc">자동 알림이 아닌 개인 일정 메모 예시</desc><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="760" height="640" rx="0" fill="#ffffff"/><rect x="0" y="0" width="760" height="8" rx="0" fill="#7a3fb0"/><text x="32" y="45" font-size="20" fill="#536174">Rent Check · 실거래로 더 정확하게</text><text x="32" y="100" font-size="36" fill="#0d1f3c" font-weight="700">달력에는 날짜 + 행동 + 시간을</text><text x="32" y="141" font-size="25" fill="#536174">자동 알림이 아닌 개인 일정 메모 예시</text><rect x="32" y="176" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="213" r="22" fill="#7a3fb0"/><text x="69" y="222" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="108" y="222" font-size="32" fill="#0d1f3c" font-weight="700">9.28. 오전 10시</text><text x="108" y="261" font-size="28" fill="#536174">접수 시작 · 인증수단 먼저 확인</text><rect x="32" y="310" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="347" r="22" fill="#7a3fb0"/><text x="69" y="356" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="108" y="356" font-size="32" fill="#0d1f3c" font-weight="700">9.30. 오후 5시</text><text x="108" y="395" font-size="28" fill="#536174">마감 전 최종 제출 · 접수번호 저장</text><rect x="32" y="444" width="696" height="115" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><circle cx="69" cy="481" r="22" fill="#7a3fb0"/><text x="69" y="490" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="108" y="490" font-size="32" fill="#0d1f3c" font-weight="700">10.23. 오후 5시 예정</text><text x="108" y="529" font-size="28" fill="#536174">서류심사 대상자 결과 직접 확인</text><path d="M32 595 H728" stroke="#d7dce3"/><text x="32" y="622" font-size="20" fill="#536174">자료 기준과 예외는 본문·그림 아래 출처에서 확인하세요.</text></g></svg>