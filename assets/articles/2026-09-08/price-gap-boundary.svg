<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">계산할 수 있는 것 ≠ 원인을 아는 것</title><desc id="desc">두 거래의 가격 차이가 곧 단지 상승률은 아닙니다.</desc><g font-family="Pretendard,Apple SD Gothic Neo,Noto Sans CJK KR,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="760" height="610" rx="0" fill="#ffffff"/><rect x="0" y="0" width="760" height="8" rx="0" fill="#7a3fb0"/><text x="32" y="45" font-size="20" fill="#536174">Rent Check · 실거래로 더 정확하게</text><text x="32" y="100" font-size="36" fill="#0d1f3c" font-weight="700">계산할 수 있는 것 ≠ 원인을 아는 것</text><text x="32" y="141" font-size="25" fill="#536174">두 거래의 가격 차이가 곧 단지 상승률은 아닙니다.</text><rect x="32" y="177" width="696" height="163" rx="12" fill="#f5f7fa" stroke="#d7dce3"/><text x="56" y="222" font-size="31" fill="#0d1f3c" font-weight="700">수록 자료로 확인한 사실</text><text x="56" y="273" font-size="31" fill="#111111">단지 · 전용면적 · 계약일 · 금액</text><text x="56" y="316" font-size="27" fill="#536174">차액은 계산할 수 있습니다.</text><rect x="32" y="360" width="696" height="188" rx="12" fill="#f7f2fb" stroke="#d7dce3"/><text x="56" y="405" font-size="31" fill="#7a3fb0" font-weight="700">아직 추가로 확인할 항목</text><text x="56" y="453" font-size="29" fill="#111111">층·동·향 / 내부수리 / 잔금·임차인</text><text x="56" y="496" font-size="29" fill="#111111">현재 해제·정정 여부</text><text x="56" y="532" font-size="24" fill="#536174">차액 전부를 특정 조건의 값으로 보지 않습니다.</text><path d="M32 565 H728" stroke="#d7dce3"/><text x="32" y="592" font-size="20" fill="#536174">자료 기준과 예외는 본문·그림 아래 출처에서 확인하세요.</text></g></svg>