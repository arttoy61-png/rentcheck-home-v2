<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">재개발 조합원 분양신청 기간과 접수증 안내</title><desc id="svgDesc">분양신청 30일부터 60일 법정기간과 실제 마감일, 접수증을 확인하는 이미지</desc>
