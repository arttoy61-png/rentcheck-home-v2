  async function fetchJson(url){const r=await fetch(`${url}${url.includes('?')?'&':'?'}v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}

function eventsFor(item,from,to,kind){

   if(!w.start||!w.end)continue;
   const end=/T00:00(?::00)?\+09:00$/.test(w.end_at||'')?cal.shift(w.end,-1):w.end;

function render(){
 const who=$('audience').value;
 const dated=items.filter(i=>(!published||noticeDate(i)===published)&&(who==='전체'||(i.audiences||[]).some(a=>who==='청년'?a==='청년':['신혼부부','신생아'].includes(a))));
 const counts=api.counts(dated);
 for(const k of ['week','later','calendar'])counts[k]=dated.filter(i=>eventsFor(i,start,cal.shift(start,6),k).length).length;
 for(const b of document.querySelectorAll('[data-status]')){const k=b.dataset.status;b.hidden=false;b.setAttribute('aria-pressed',String(k===filter));b.lastElementChild.textContent=counts[k]+'건';}
 drawWeek(dated);
 $('dateFilter').hidden=!published;$('dateFilter').firstElementChild.textContent=published+' 공고';
 const rows=isWeek()?dated.filter(i=>steps(i).length):dated.filter(i=>api.matches(i,filter));
 if(isWeek())rows.sort((a,b)=>steps(a).map(e=>e.start).sort()[0].localeCompare(steps(b).map(e=>e.start).sort()[0]));
 $('status').textContent=isWeek()?(rows.length?'원문에서 확인한 '+labels[filter]+' 일정 · 공고 '+rows.length+'건':'이 기간에 원문에서 확인된 '+labels[filter]+' 일정이 없어요.'):(rows.length?labels[filter]+' '+rows.length+'건 · 공고일 최신순':'이 조건에 해당하는 모집공고가 없어요.');
 $('list').replaceChildren(...rows.slice(0,limit).map(card));
 $('more').hidden=limit>=rows.length;$('more').textContent=Math.min(6,rows.length-limit)+'건 더 보기';
 $('fresh').textContent=feedMeta?.generated_at?'자료 생성 '+new Date(feedMeta.generated_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' (한국시간)':'보조 공고 자료 기준';
 $('sources').textContent='후속 일정 원문 대조일 '+cal.checked+'. 날짜가 없는 개별 안내는 공고 안에서 확인하세요.'+(feedMeta?.source_status?.LH?.status==='부분수집'?' LH 모집공고는 부분 수집 상태예요.':'');
}
async function refresh(){
 if(busy)return;busy=true;$('retry').hidden=true;
 try{
  if(!api)throw Error('status data');
  feedMeta=null;await loadRoutes();const raw=await loadItems();items=sortNotices(cal.prepare(raw));render();
  parent.document.dispatchEvent(new parent.CustomEvent('rentcheck:preview-housing',{detail:{items:raw}}));
 }catch{ $('status').textContent=items?'목록을 갱신하지 못했어요. 이전에 불러온 공고를 표시합니다.':'공고 자료를 불러오지 못했어요.';$('retry').hidden=false; }
 finally{busy=false;}
}
$('retry').onclick=()=>api?refresh():parent.location.reload();
$('more').onclick=()=>{const previous=limit;limit+=6;render();$('list').children[previous]?.firstElementChild.focus({preventScroll:true});};
$('dateFilter').querySelector('button').onclick=()=>changeFilter(filter,'');
const youth=new URL(parent.location.href);youth.hash='youth-score';$('youth').href=youth.href;
parent.addEventListener('hashchange',setRoute);setRoute();
</script></body></html>
