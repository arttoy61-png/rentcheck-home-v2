<!doctype html><html lang="ko"><head><meta name="robots" content="noindex,follow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#142c43;font:400 15px/1.5 Gmarket,"Malgun Gothic",sans-serif;word-break:keep-all}main{max-width:660px;margin:auto;padding:14px 16px 36px}a{color:#254c69;text-underline-offset:3px}#trades{font-size:13px}h1{font-size:clamp(26px,6vw,34px);line-height:1.22;letter-spacing:-.05em;margin:15px 0 2px}header p,#actual,#period,.card p,.prices small{font-size:13px;color:#536575}p{margin:5px 0 9px}button{font:inherit;cursor:pointer}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #967124;outline-offset:2px}
#bands{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 5px}#bands button,#expand{min-height:42px;padding:6px 11px;border:1px solid #c6d2dc;background:white;border-radius:8px;font-size:14px;color:#142c43}#bands [aria-pressed=true]{background:#102642;color:white;border-color:#102642}
.card{background:white;border:1px solid #d4dde5;border-radius:12px;padding:13px 14px;margin:10px 0}h2{font-size:18px;line-height:1.35;margin:0 0 10px;letter-spacing:-.035em}.prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.prices>div{padding:10px;border-radius:8px;background:#edf2f6}.prices>div+div{background:#f8f4ea}.prices span,.prices small,.prices strong{display:block}.prices span{font-size:13px}.prices strong{font-size:clamp(18px,4.5vw,24px);line-height:1.3;letter-spacing:-.055em;margin:7px 0}.prices small{font-size:12px}.ratio,.head,.peer-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.ratio{margin-top:10px;font-size:14px}.ratio b{color:#142d43}.legend{font-size:12px;display:flex;gap:9px;color:#425668}.legend span:before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:#315872;margin-right:4px}.legend span+span:before{background:#b08135}
#bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}.month{min-width:0;text-align:center;font-size:12px}.pair{height:102px;display:flex;justify-content:center;align-items:flex-end;gap:2px;border-bottom:1px solid #c6d2dc}.bar{width:42%;max-width:22px;position:relative;background:#315872;border-radius:3px 3px 0 0}.bar.je{background:#b08135}.bar i{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;font:normal 10px/1.25 Gmarket,sans-serif;color:#30495a}.month-label{display:block;padding-top:4px}#period{margin-top:9px;font-size:12px}
details summary{cursor:pointer;font-size:14px;font-weight:700;padding:5px 0}.card>summary{font-size:16px}details.card{padding-top:8px;padding-bottom:8px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;text-align:right}td,th{padding:5px 3px;border-bottom:1px solid #e5eaee}td:first-child,th:first-child{text-align:left}dl{margin:0}dt{font-weight:700;margin-top:8px}dd{margin:0;font-size:14px}.peer{display:block;color:inherit;text-decoration:none;border-top:1px solid #dce3e8;padding:10px 0}.peer-top b{font-size:15px}.peer-top strong{text-align:right;font-size:14px}.peer small{display:block;color:#526575;margin-top:2px}.peer:focus-visible,.peer:hover{text-decoration:underline}#expand{margin:5px 0}.card nav{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:13px} [hidden]{display:none!important}
@media(max-width:355px){main{padding:12px 10px}.card{padding:11px}.prices>div{padding:8px}.pair{gap:1px}.bar i{font-size:9px}}
</style></head>
<body><main><a id="trades" target="_top">실거래 내역으로</a>
<header><h1 id="title">단지 상세보기</h1><p id="meta"></p></header>
<p id="load" role="status">단지 정보를 불러오는 중입니다.</p>
<div id="content" hidden>
<div id="bands" role="group" aria-label="전용면적형"></div><p id="actual"></p>
<section class="card"><h2>6개월 중위가격</h2><div class="prices">
<div><span>매매</span><strong id="sale"></strong><small id="ns"></small></div>
<div><span>전세</span><strong id="je"></strong><small id="nj"></small></div></div>
<div class="ratio"><span>전세가율</span><b id="ratio"></b></div>
</section>
<section class="card"><div class="head"><h2>월별 거래 건수</h2><div class="legend"><span>매매</span><span>전세</span></div></div>
<div id="bars"></div><p id="period"></p>
<details><summary>월별 거래 내역</summary><div class="scroll"><table><thead><tr><th>월</th><th>매매</th><th>매매 중위</th><th>전세</th><th>전세 중위</th><th>월세</th></tr></thead><tbody id="months"></tbody></table></div></details>
</section>
<details class="card" id="near"><summary>주변 단지와 비교</summary>
<p id="criteria"></p><div id="near-list"></div><button id="expand" type="button" hidden>비슷한 면적까지 보기</button></details>
<details class="card"><summary>최근 매매·전세·월세</summary><dl id="latest"></dl></details>
<details class="card"><summary>자료 출처와 계산 기준</summary><p>계약일 기준으로 집계합니다. 매매·전세가 각각 3건 이상일 때 해당 중위가격을 표시하고, 두 중위가격이 모두 있을 때 전세가율을 계산합니다.</p><p id="stamp"></p><nav><a href="https://www.data.go.kr/data/15126469/openapi.do" target="_blank" rel="noopener">국토부 매매 API</a> <a href="https://www.data.go.kr/data/15126474/openapi.do" target="_blank" rel="noopener">국토부 전월세 API</a> <a id="src-summary" target="_blank" rel="noopener">요약 자료</a> <a id="src-detail" target="_blank" rel="noopener">상세 자료</a></nav></details>
</div></main><script>let S;
const DATA_BASES=['https://raw.githubusercontent.com/arttoy61-png/rent-check/main/','https://cdn.jsdelivr.net/gh/arttoy61-png/rent-check@main/','https://arttoy61-png.github.io/rent-check/','/tools/apartment/data/'];let dataPairPromise=null,apartmentDataSource='';async function fetchDataFile(name){if(!dataPairPromise)dataPairPromise=(async()=>{let lastErr;for(const base of DATA_BASES){try{const responses=await Promise.all(['gangseo_apt_summary.json','gangseo_apt_detail.json'].map(file=>fetch(base+file+(base.includes('jsdelivr')?'?v='+Date.now():''),{cache:'no-store',mode:'cors'})));if(responses.some(r=>!r.ok))throw Error('Data unavailable');const [summary,detail]=await Promise.all(responses.map(r=>r.json()));if(!Array.isArray(summary.complexes)||!summary.complexes.length||!summary.generated_at||!detail||summary.complexes.some(c=>!Array.isArray(detail[c.id]?.areas)))throw Error('Invalid snapshot pair');for(const c of summary.complexes){const areas=detail[c.id].areas,rep=areas.find(a=>a.m2===c.m2);if(!rep||['nS','nJ','nW','mid','ppy'].some(k=>(rep[k]??null)!==(c[k]??null))||[['tS','nS'],['tJ','nJ'],['tW','nW']].some(([total,count])=>areas.reduce((n,a)=>n+a[count],0)!==c[total]))throw Error('Snapshot totals mismatch')}apartmentDataSource=base;return {'gangseo_apt_summary.json':summary,'gangseo_apt_detail.json':detail}}catch(e){lastErr=e}}throw lastErr})();return (await dataPairPromise)[name]}
const median=a=>{const s=(a||[]).filter(v=>Number.isFinite(Number(v))).map(Number).sort((x,y)=>x-y);if(!s.length)return null;const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const monthKey=d=>String(d||'').replaceAll('.','-').slice(0,7).replace('-','');
function months6(ym){ym=String(ym||'').replace(/\D/g,'').slice(0,6);if(ym.length!==6)return[];let y=+ym.slice(0,4),m=+ym.slice(4,6),out=[];for(let i=5;i>=0;i--){let mm=m-i,yy=y;while(mm<=0){mm+=12;yy--}out.push(String(yy)+String(mm).padStart(2,'0'))}return out}
function rows6(arr,months){const set=new Set(months);return (arr||[]).filter(x=>set.has(monthKey(x.date)))}
function latest(arr){return [...(arr||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||null}
function distM(lat1,lng1,lat2,lng2){const R=6371000,p1=lat1*Math.PI/180,p2=lat2*Math.PI/180,dp=(lat2-lat1)*Math.PI/180,dl=(lng2-lng1)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function core(a){const bounds=Array.isArray(S?.meta?.period)?S.meta.period:null;let months=months6(S?.meta?.updated||new Date().toISOString().slice(0,7));if(bounds&&bounds.length===2){months=[];const start=bounds[0].slice(0,7),end=bounds[1].slice(0,7);let [y,m]=start.split('-').map(Number);for(let guard=0;guard<24;guard++){const ym=String(y)+'-'+String(m).padStart(2,'0');months.push(ym.replace('-',''));if(ym===end)break;if(++m===13){m=1;y++}}}const inPeriod=rows=>bounds?(rows||[]).filter(x=>{const d=String(x.date||'').replaceAll('.','-');return d>=bounds[0]&&d<=bounds[1]}):rows6(rows,months),sale=inPeriod(a.sale),je=inPeriod(a.jeonse),wo=inPeriod(a.wolse),saleMed=sale.length>=3?median(sale.map(x=>x.amt)):null,jeMed=je.length>=3?median(je.map(x=>x.dep)):null;return{months,sale,je,wo,saleMed,jeMed,lastSale:latest(sale),lastJe:latest(je),lastWo:latest(wo),ratio:(saleMed&&jeMed)?Math.round(jeMed/saleMed*1000)/10:null}}

function monthly(a,c){return c.months.map(m=>{const s=c.sale.filter(x=>monthKey(x.date)===m),j=c.je.filter(x=>monthKey(x.date)===m),w=c.wo.filter(x=>monthKey(x.date)===m);return{m,s,j,w,sm:s.length>=3?median(s.map(x=>x.amt)):null,jm:j.length>=3?median(j.map(x=>x.dep)):null}})}
function formatAptMoney(value) {
  if (value == null || !Number.isFinite(value)) return '-';
  const won = Math.round(value * 10000);
  const eok = Math.floor(won / 10000), man = won % 10000;
  return [eok ? eok + '억' : '', man ? man.toLocaleString('ko-KR') + '만' : ''].filter(Boolean).join(' ') + (won ? ' 원' : '0원');
}
</script><script>(() => {
  const id = new URLSearchParams(parent.location.search).get('id');
  const el = key => document.getElementById(key);
  const text = (key,value) => el(key).textContent=value;
  const node = (tag,content,cls) => {
    const n=document.createElement(tag);
    if(content!=null)n.textContent=content;
    if(cls)n.className=cls;
    return n;
  };
  const fonts=document.createElement('style');
  for(const s of parent.document.querySelectorAll('style')) fonts.textContent+=(s.textContent.match(/@font-face\s*\{\s*font-family:Gmarket;[^}]+\}/g)||[]).join('\n');
  document.head.append(fonts);
  let details, listing, home, selected, neighbours=[], expanded=false;
  const cache=new WeakMap();
  function stats(area) {
    if(!cache.has(area))cache.set(area,core(area));
    return cache.get(area);
  }
  function linkTo(key,area,profile) {
    const u=new URL(parent.location.href);
    u.hash='apartment';
    for(const [name,value] of Object.entries({id:key,area,panel:profile?'profile':null})){
      if(value==null)u.searchParams.delete(name);else u.searchParams.set(name,value);
    }
    return u.href;
  }
  function actual(c) {
    const values=[...c.sale,...c.je,...c.wo].map(t=>Number(t.m2)).filter(n=>Number.isFinite(n)&&n>0);
    if(!values.length)return '계약 전용면적 미확인';
    const lo=Math.min(...values),hi=Math.max(...values);
    return '계약 전용 '+lo+(lo===hi?'':'~'+hi)+'㎡';
  }
  function paintMonths(c) {
    const rows=monthly(selected,c),peak=Math.max(1,...rows.map(r=>Math.max(r.s.length,r.j.length)));
    el('bars').replaceChildren(...rows.map(r=>{
      const col=node('div',null,'month'), pair=node('div',null,'pair');
      for(const [type,count] of [['sale',r.s.length],['je',r.j.length]]){
        const bar=node('div',null,'bar '+type);
        bar.style.height=84*count/peak+'%';bar.dataset.count=count;bar.append(node('i',String(count)));
        pair.append(bar);
      }
      col.setAttribute('aria-label',r.m.slice(0,4)+'년 '+Number(r.m.slice(4))+'월 매매 '+r.s.length+'건, 전세 '+r.j.length+'건');
      col.append(pair,node('span',Number(r.m.slice(4))+'월','month-label'));return col;
    }));
    el('months').replaceChildren(...rows.map(r=>{
      const tr=node('tr');for(const val of [r.m.slice(0,4)+'.'+r.m.slice(4),r.s.length,formatAptMoney(r.sm),r.j.length,formatAptMoney(r.jm),r.w.length])tr.append(node('td',String(val)));return tr;
    }));
    text('period','계약일 기준 · '+(S.meta?.period||[]).join(' ~ '));
  }
  function buildNeighbours() {
    if(!listing?.lat||!listing.lng)return [];
    return S.complexes.filter(x=>x.id!==id&&x.lat&&x.lng&&details[x.id]?.areas?.length)
      .map(x=>({x,dist:distM(listing.lat,listing.lng,x.lat,x.lng)}))
      .filter(r=>r.dist<=1500).sort((a,b)=>a.dist-b.dist);
  }
  function paintNearby() {
    const exact=[],other=[];
    for(const {x,dist} of neighbours){
      const areas=details[x.id].areas;
      const eq=areas.find(a=>a.m2===selected.m2);
      if(eq&&stats(eq).saleMed!=null){exact.push({x,dist,a:eq});continue;}
      const alt=areas.filter(a=>a.m2!==selected.m2&&Math.abs(a.m2-selected.m2)<=25&&stats(a).saleMed!=null)
        .sort((a,b)=>Math.abs(a.m2-selected.m2)-Math.abs(b.m2-selected.m2))[0];
      if(alt)other.push({x,dist,a:alt});
    }
    const shown=exact.slice(0,4);
    const canExpand=shown.length<4&&other.length>0;
    if(expanded&&canExpand)shown.push(...other.slice(0,4-shown.length));
    const basis=stats(selected).saleMed;
    text('criteria',listing?.lat&&listing.lng?'반경 1.5km · '+selected.m2+'㎡형 우선 · 매매 3건 이상':'단지 좌표가 없어 거리를 비교할 수 없습니다.');
    const links=shown.map(({x,dist,a})=>{
      const c=stats(a),link=node('a',null,'peer'),top=node('div',null,'peer-top');
      link.href=linkTo(x.id,a.m2,true);link.target='_top';link.dataset.band=a.m2;
      top.append(node('b',x.nm),node('strong',formatAptMoney(c.saleMed)));
      let sub=a.m2+'㎡형 · '+actual(c)+' · '+Math.round(dist)+'m · 매매 '+c.sale.length+'건';
      if(basis!=null){const diff=Math.round((c.saleMed-basis)*10000);sub+=' · '+(diff===0?'기준과 동일':'기준 대비 '+(diff>0?'+':'−')+formatAptMoney(Math.abs(diff)/10000));}
      link.append(top,node('small',sub));return link;
    });
    if(!links.length && listing?.lat&&listing.lng)links.push(node('p','같은 면적형에서 비교할 매매 사례가 충분하지 않습니다.'));
    el('near-list').replaceChildren(...links);
    el('expand').hidden=!canExpand;el('expand').setAttribute('aria-expanded',String(expanded&&canExpand));
    text('expand',expanded?'같은 면적형만 보기':'비슷한 면적까지 보기 (±25㎡)');
  }
  function paint() {
    const c=stats(selected);
    for(const b of el('bands').children)b.setAttribute('aria-pressed',String(Number(b.dataset.band)===selected.m2));
    text('actual',selected.m2+'㎡형 · '+actual(c));
    for(const [key,price] of [['sale',c.saleMed],['je',c.jeMed]])text(key,price==null?'표본 부족':formatAptMoney(price));
    text('ns',c.sale.length+'건');text('nj',c.je.length+'건');text('ratio',c.ratio==null?'산출 자료 부족':c.ratio+'%');
    el('trades').href=linkTo(id,selected.m2,false);
    paintMonths(c);
    el('latest').replaceChildren();
    for(const [name,r] of [['매매',c.lastSale],['전세',c.lastJe],['월세',c.lastWo]]){
      let desc='조회기간 내 거래 없음';
      if(r){const amount=name==='매매'?formatAptMoney(r.amt):formatAptMoney(r.dep);
        desc=amount+(name==='월세'?' / 월 '+r.rent+'만 원':'')+' · '+r.date+' · '+r.m2+'㎡ · '+(r.fl??'-')+'층';}
      el('latest').append(node('dt',name),node('dd',desc));
    }
    if(el('near').open)paintNearby();
  }
  el('trades').href=linkTo(null,null,false);
  el('near').addEventListener('toggle',()=>{if(el('near').open&&selected)paintNearby();});
  el('expand').onclick=()=>{expanded=!expanded;paintNearby();};
  Promise.all(['summary','detail'].map(k=>fetchDataFile('gangseo_apt_'+k+'.json'))).then(([summary,data])=>{
    S=summary;details=data;home=data[id];listing=summary.complexes.find(c=>c.id===id);
    if(!home?.areas?.length||!listing)throw Error('missing');
    const requested=new URLSearchParams(parent.location.search).get('area');
    selected=requested===null?home.areas[0]:home.areas.find(a=>a.m2===Number(requested));
    if(!selected)throw Error('area');
    neighbours=buildNeighbours();text('title',home.nm);parent.document.title=home.nm+' 단지 상세보기 | Rent Check';
    text('meta',[home.dong,home.yr?home.yr+'년 준공':null,listing.un?Number(listing.un).toLocaleString()+'세대':null].filter(Boolean).join(' · '));
    el('bands').replaceChildren(...[...home.areas].sort((a,b)=>a.m2-b.m2).map(a=>{
      const b=node('button',a.m2+'㎡형');b.type='button';b.dataset.band=a.m2;
      b.onclick=()=>{selected=a;expanded=false;parent.history.replaceState(parent.history.state,'',linkTo(id,a.m2,true));paint();};return b;
    }));
    for(const k of ['summary','detail'])el('src-'+k).href=new URL(apartmentDataSource+'gangseo_apt_'+k+'.json','https://rent-check.kr/').href;
    const status={success:'수집 완료',partial:'일부 수집',failed:'최근 수집 실패'}[S.collection?.status]||'수집 상태 미확인';
    text('stamp',status+' · 자료 생성 '+S.generated_at+(apartmentDataSource.startsWith('/')?' · 보관 자료':''));
    paint();el('load').hidden=true;el('content').hidden=false;
  }).catch(e=>{text('load',e.message==='missing'?'해당 단지를 찾지 못했습니다.':e.message==='area'?'해당 면적형을 찾지 못했습니다.':'거래 자료를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.');});
})();
</script></body></html>
