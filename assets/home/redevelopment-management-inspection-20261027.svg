<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">재개발 관리처분계획 공람 안내</title><desc id="svgDesc">공람 30일 이상, 종전자산가격과 분담금, 의견제출 서류를 확인하는 이미지</desc>
