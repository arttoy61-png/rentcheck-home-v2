<text x="88" y="112" fill="#FFFFFF" font-family="Noto Sans KR,Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="29" font-weight="750">재개발 · 조합원</text>
<text x="63" y="220" fill="#0D1F3C" font-family="Noto Sans KR,Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="70" font-weight="800">관리처분계획</text>
