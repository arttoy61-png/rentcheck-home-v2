<rect x="590" y="111" width="192" height="286" rx="16" fill="#FFFFFF" stroke="#0D1F3C" stroke-width="7"/>
<rect x="619" y="159" width="135" height="22" rx="6" fill="#1565C0"/>
<path d="M622 236 l12 13 21 -25 M622 293 l12 13 21 -25" fill="none" stroke="#1565C0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
